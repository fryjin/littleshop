<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>会员积分 · 香薰雕刻蜡烛</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="member">
  <main class="prototype-page">
    <section class="phone-shell" aria-label="会员积分页面视觉稿">
      <div class="wx-status"><span>11:26</span><span class="wx-dots"><span></span><span></span><span></span></span></div>
      <header class="wx-header">
        <a class="icon-button" href="mine.html" aria-label="返回我的"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m15 18-6-6 6-6"/></svg></a>
        <div>
          <h1>会员积分</h1>
          <span class="subtle-title">余额 · 明细 · 商城</span>
        </div>
        <div class="capsule" aria-label="微信胶囊按钮">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8"/></svg>
        </div>
      </header>

      <div class="screen-scroll has-cta">
        <section class="section">
          <div class="points-summary-card">
            <span>当前积分</span>
            <strong>1280</strong>
            <p>本月将到期 120 分，可先去积分商城兑换复购券或礼盒升级券。</p>
            <div class="points-mini-grid">
              <div><b>+528</b><span>本月累计</span></div>
              <div><b>-300</b><span>本月使用</span></div>
              <div><b>V2</b><span>礼盒会员</span></div>
            </div>
          </div>
        </section>

        <section class="section">
          <a class="points-mall-card" href="coupons.html">
            <div>
              <strong>积分商城</strong>
              <span>兑换复购券、贺卡券和礼盒升级券。</span>
            </div>
            <em>进入</em>
          </a>
        </section>

        <section class="section">
          <div class="section-head">
            <h2 class="section-title serif">积分累计</h2>
            <span class="section-note">近 30 天</span>
          </div>
          <div class="points-log-list">
            <div class="points-log-row"><div><strong>完成礼盒订单</strong><span>莓果洛可可 · 中号</span></div><b>+328</b></div>
            <div class="points-log-row"><div><strong>保存收货地址</strong><span>默认地址已设置</span></div><b>+80</b></div>
            <div class="points-log-row"><div><strong>领取生日月权益</strong><span>生日月任务</span></div><b>+120</b></div>
          </div>
        </section>

        <section class="section">
          <div class="section-head">
            <h2 class="section-title serif">积分消费</h2>
            <span class="section-note">兑换记录</span>
          </div>
          <div class="points-log-list">
            <div class="points-log-row spend"><div><strong>会员积分兑换券</strong><span>复购券 · 已入卡包</span></div><b>-300</b></div>
            <div class="points-log-row muted"><div><strong>暂无更多消费</strong><span>兑换后会在这里记录</span></div><b>0</b></div>
          </div>
        </section>
      </div>

      <div class="sticky-cta">
        <a class="btn ghost" href="mine.html">返回我的</a>
        <a class="btn primary" href="coupons.html">进入积分商城</a>
      </div>
      <div class="toast" data-toast-host role="status" aria-live="polite"></div>
    </section>
  </main>
  <script src="assets/app.js"></script>
</body>
</html>
