<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>送礼 · 香薰雕刻蜡烛</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="gift">
  <main class="prototype-page">
    <section class="phone-shell" aria-label="零售送礼页面视觉稿">
      <div class="wx-status"><span>11:26</span><span class="wx-dots"><span></span><span></span><span></span></span></div>
      <header class="wx-header">
        <a class="icon-button" href="home.html" aria-label="返回首页"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m15 18-6-6 6-6"/></svg></a>
        <div>
          <h1>送礼</h1>
          <span class="subtle-title">预算 · 场景 · 节日</span>
        </div>
        <div class="capsule" aria-label="微信胶囊按钮">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8"/></svg>
        </div>
      </header>

      <div class="screen-scroll gift-search-scroll" data-gift-hub>
        <section class="gift-filter-board" aria-label="送礼筛选">
          <div class="gift-filter-row">
            <span class="gift-filter-label">预算</span>
            <div class="gift-filter-chips" data-gift-filter-row="budget">
              <button class="gift-filter-chip active" type="button" data-gift-filter="budget" data-filter-value="all" aria-pressed="true">不限</button>
              <button class="gift-filter-chip" type="button" data-gift-filter="budget" data-filter-value="under199" aria-pressed="false">¥199 内</button>
              <button class="gift-filter-chip" type="button" data-gift-filter="budget" data-filter-value="mid399" aria-pressed="false">¥200-399</button>
              <button class="gift-filter-chip" type="button" data-gift-filter="budget" data-filter-value="high699" aria-pressed="false">¥400-699</button>
              <button class="gift-filter-chip" type="button" data-gift-filter="budget" data-filter-value="over700" aria-pressed="false">¥700+</button>
              <button class="gift-filter-chip custom" type="button" data-gift-custom-budget aria-pressed="false">自定义</button>
            </div>
          </div>

          <div class="gift-filter-row">
            <span class="gift-filter-label">场景</span>
            <div class="gift-filter-chips" data-gift-filter-row="scene">
              <button class="gift-filter-chip active" type="button" data-gift-filter="scene" data-filter-value="all" aria-pressed="true">不限</button>
              <button class="gift-filter-chip" type="button" data-gift-filter="scene" data-filter-value="birthday" aria-pressed="false">生日答谢</button>
              <button class="gift-filter-chip" type="button" data-gift-filter="scene" data-filter-value="housewarming" aria-pressed="false">乔迁日常</button>
              <button class="gift-filter-chip" type="button" data-gift-filter="scene" data-filter-value="important" aria-pressed="false">重要关系</button>
              <button class="gift-filter-chip" type="button" data-gift-filter="scene" data-filter-value="business" aria-pressed="false">企业节点</button>
            </div>
          </div>

          <div class="gift-filter-row">
            <span class="gift-filter-label">节日</span>
            <div class="gift-filter-chips" data-gift-filter-row="festival">
              <button class="gift-filter-chip active" type="button" data-gift-filter="festival" data-filter-value="all" aria-pressed="true">不限</button>
              <button class="gift-filter-chip" type="button" data-gift-filter="festival" data-filter-value="spring" aria-pressed="false">春节</button>
              <button class="gift-filter-chip" type="button" data-gift-filter="festival" data-filter-value="midautumn" aria-pressed="false">中秋</button>
              <button class="gift-filter-chip" type="button" data-gift-filter="festival" data-filter-value="romance" aria-pressed="false">520/七夕</button>
              <button class="gift-filter-chip" type="button" data-gift-filter="festival" data-filter-value="yearend" aria-pressed="false">年末</button>
            </div>
          </div>
        </section>

        <section class="section gift-result-section">
          <div class="section-head compact">
            <div>
              <h2 class="section-title serif">推荐商品</h2>
              <p class="section-subnote">默认按热度排序，筛选后只保留相关款式。</p>
            </div>
            <span class="section-note" data-gift-result-count>5 款</span>
          </div>
          <div class="gift-result-list" data-gift-results></div>
        </section>
      </div>

      <div class="budget-range-sheet" data-gift-range-sheet hidden>
        <button class="range-backdrop" type="button" data-gift-range-close aria-label="关闭预算选择"></button>
        <div class="range-panel" role="dialog" aria-modal="true" aria-label="自定义预算">
          <div class="range-panel-head">
            <div>
              <strong>自定义预算</strong>
              <span>拖动区间后刷新推荐</span>
            </div>
            <button class="round-action" type="button" data-gift-range-close aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
          </div>
          <div class="range-value-row">
            <span data-gift-range-label>¥200 - ¥500</span>
          </div>
          <label class="range-field">
            <span>最低预算</span>
            <input type="range" min="0" max="1000" step="50" value="200" data-gift-range-min>
          </label>
          <label class="range-field">
            <span>最高预算</span>
            <input type="range" min="100" max="1500" step="50" value="500" data-gift-range-max>
          </label>
          <button class="btn primary" type="button" data-gift-range-apply>应用预算</button>
        </div>
      </div>

      <nav class="tabbar" aria-label="底部导航">
        <a class="tab-item" data-tab="home" href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>首页</span></a>
        <a class="tab-item" data-tab="gift" href="gift.html#scene"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 12v8H4v-8"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/></svg><span>送礼</span></a>
        <a class="tab-item" data-tab="catalog" href="catalog.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h7v7H4z"/><path d="M13 4h7v7h-7z"/><path d="M4 13h7v7H4z"/><path d="M13 13h7v7h-7z"/></svg><span>商品</span></a>
        <a class="tab-item" data-tab="cart" href="cart.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/><path d="M3 4h2l3 12h10l3-8H7"/></svg><span>购物车</span></a>
        <a class="tab-item" data-tab="mine" href="mine.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 22a8 8 0 0 1 16 0"/></svg><span>我的</span></a>
      </nav>
      <div class="toast" data-toast-host role="status" aria-live="polite"></div>
    </section>
  </main>
  <script src="assets/app.js"></script>
</body>
</html>
