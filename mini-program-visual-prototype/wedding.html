<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>婚礼批量采购 · 香薰雕刻蜡烛</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="wedding">
  <main class="prototype-page">
    <section class="phone-shell" aria-label="婚礼批量采购页面视觉稿">
      <div class="wx-status"><span>11:26</span><span class="wx-dots"><span></span><span></span><span></span></span></div>
      <header class="wx-header">
        <a class="icon-button" href="home.html" aria-label="返回首页"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m15 18-6-6 6-6"/></svg></a>
        <div>
          <h1>婚礼采购</h1>
          <span class="subtle-title">桌礼 · 伴手礼 · 陈列</span>
        </div>
        <div class="capsule" aria-label="微信胶囊按钮">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8"/></svg>
        </div>
      </header>

      <div class="screen-scroll has-cta">
        <section class="section">
          <p class="panel-hint">可多选使用场景，再填写数量、预算和日期。价格按数量、包装和交期确认。</p>
          <div class="choice-grid" data-choice-group="multi">
            <button class="choice-card" data-choice aria-pressed="false"><strong>桌礼点缀</strong><span>每桌 1-2 支，强调仪式感和拍照效果。</span></button>
            <button class="choice-card" data-choice aria-pressed="false"><strong>宾客伴手礼</strong><span>小号或中号组合，适合统一包装和贺卡。</span></button>
            <button class="choice-card" data-choice aria-pressed="false"><strong>迎宾区陈列</strong><span>大尺寸与成套色系，形成入口视觉焦点。</span></button>
          </div>
        </section>

        <section class="section">
          <div class="recommend-result-stack wedding-result-stack">
            <article class="ai-result wedding-result-card">
              <img src="assets/gift-box-candle.png" alt="象牙金蓝伴手礼组合">
              <div>
                <div class="tag-row"><span class="tag berry">推荐一</span><span class="tag">伴手礼</span></div>
                <h3>象牙金蓝 · 伴手礼组合</h3>
                <p>温和稳妥，适合白金、蓝金和花艺场景。</p>
                <div class="price-line">¥3300 <small>/ 60 支参考</small></div>
                <button class="catalog-product-action wedding-add-button" type="button" data-recommend-add-cart data-cart-series="wedding" data-cart-series-label="婚礼" data-cart-packaging="批量包装待确认" data-cart-extra="顾问核对" data-cart-price="3300" aria-label="加入购物车">+</button>
              </div>
            </article>
            <article class="ai-result wedding-result-card">
              <img src="assets/product-berry-candle.png" alt="莓果洛可可桌礼点缀">
              <div>
                <div class="tag-row"><span class="tag">推荐二</span><span class="tag">桌礼</span></div>
                <h3>莓果洛可可 · 桌礼点缀</h3>
                <p>仪式感更强，适合主桌、签到台和拍照区。</p>
                <div class="price-line">¥4200 <small>/ 60 支参考</small></div>
                <button class="catalog-product-action wedding-add-button" type="button" data-recommend-add-cart data-cart-series="wedding" data-cart-series-label="婚礼" data-cart-packaging="批量包装待确认" data-cart-extra="顾问核对" data-cart-price="4200" aria-label="加入购物车">+</button>
              </div>
            </article>
            <article class="ai-result wedding-result-card">
              <img src="assets/catalog/advanced-02.png" alt="森林松绿迎宾陈列">
              <div>
                <div class="tag-row"><span class="tag">推荐三</span><span class="tag">迎宾区</span></div>
                <h3>森林松绿 · 迎宾陈列</h3>
                <p>更适合户外、森系和绿白花艺场景。</p>
                <div class="price-line">顾问确认 <small>按数量</small></div>
                <button class="catalog-product-action wedding-add-button" type="button" data-recommend-add-cart data-cart-series="wedding" data-cart-series-label="婚礼" data-cart-packaging="批量包装待确认" data-cart-extra="顾问核对" data-cart-price="3300" aria-label="加入购物车">+</button>
              </div>
            </article>
          </div>
        </section>

        <section class="section">
          <form class="form-card">
            <div class="field"><label for="wedding-count">预计数量</label><input id="wedding-count" inputmode="numeric" placeholder="例如：60 支"></div>
            <div class="field"><label for="wedding-budget">预算区间</label><select id="wedding-budget"><option>¥3000-5000</option><option>¥5000-8000</option><option>¥8000 以上</option></select></div>
            <div class="field"><label for="wedding-date">婚礼日期</label><input id="wedding-date" placeholder="例如：2026 年 10 月"></div>
          </form>
        </section>
      </div>

      <div class="sticky-cta">
        <a class="btn ghost" href="cart.html">查看购物车</a>
        <button class="btn primary" data-toast="已提交采购需求">提交采购咨询</button>
      </div>
      <div class="toast" data-toast-host role="status" aria-live="polite"></div>
    </section>
  </main>
  <script src="assets/app.js"></script>
</body>
</html>
