<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>复购券 · 香薰雕刻蜡烛</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="coupons">
  <main class="prototype-page">
    <section class="phone-shell" aria-label="复购券页面视觉稿">
      <div class="wx-status"><span>11:26</span><span class="wx-dots"><span></span><span></span><span></span></span></div>
      <header class="wx-header">
        <a class="icon-button" href="mine.html" aria-label="返回我的"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m15 18-6-6 6-6"/></svg></a>
        <div>
          <h1>复购券</h1>
          <span class="subtle-title">领券 · 到期 · 推荐</span>
        </div>
        <div class="capsule" aria-label="微信胶囊按钮">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8"/></svg>
        </div>
      </header>

      <div class="screen-scroll has-cta">
        <section class="section">
          <div class="section-head">
            <h2 class="section-title serif">可用优惠</h2>
            <span class="section-note">优先服务复购</span>
          </div>
          <div class="coupon-stack">
            <article class="coupon-card">
              <div class="coupon-value"><div><strong>¥80</strong><span>礼盒满减</span></div></div>
              <div class="coupon-info">
                <h3>节日礼盒复购券</h3>
                <p>满 ¥528 可用，适合晨雾金蓝礼盒和定制贺卡组合。</p>
                <div class="tag-row"><span class="tag berry">7 天后到期</span><span class="tag">礼盒可用</span></div>
              </div>
            </article>
            <article class="coupon-card">
              <div class="coupon-value"><div><strong>¥30</strong><span>会员兑换</span></div></div>
              <div class="coupon-info">
                <h3>会员积分兑换券</h3>
                <p>300 积分兑换，适合中号单品复购或礼盒升级。</p>
                <div class="tag-row"><span class="tag">长期有效</span><span class="tag">积分兑换</span></div>
              </div>
            </article>
          </div>
        </section>

        <section class="section">
          <div class="section-head">
            <h2 class="section-title serif">领券中心</h2>
          </div>
          <div class="choice-grid" data-choice-group="multi">
            <button class="choice-card" data-choice aria-pressed="true"><strong>生日月贺卡券</strong><span>赠送空白贺卡，适合生日礼物场景。</span></button>
            <button class="choice-card" data-choice aria-pressed="false"><strong>礼盒升级券</strong><span>下单时可抵扣硬质礼盒包装费用。</span></button>
          </div>
        </section>

      </div>

      <div class="sticky-cta">
        <a class="btn ghost" href="member.html?from=coupons">积分兑换</a>
        <button class="btn primary" data-toast="已领取复购券">领取复购券</button>
      </div>
      <div class="toast" data-toast-host role="status" aria-live="polite"></div>
    </section>
  </main>
  <script src="assets/app.js"></script>
</body>
</html>
