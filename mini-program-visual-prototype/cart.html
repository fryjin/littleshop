<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>购物车 · 香薰雕刻蜡烛</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="cart">
  <main class="prototype-page">
    <section class="phone-shell" aria-label="购物车页面视觉稿">
      <div class="wx-status"><span>11:26</span><span class="wx-dots"><span></span><span></span><span></span></span></div>
      <header class="wx-header">
        <a class="icon-button" href="product.html" aria-label="返回商品详情"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m15 18-6-6 6-6"/></svg></a>
        <div>
          <h1>购物车</h1>
          <span class="subtle-title">下单前检查配置</span>
        </div>
        <div class="capsule" aria-label="微信胶囊按钮">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8"/></svg>
        </div>
      </header>

      <div class="screen-scroll has-cta cart-scroll">
        <section class="section cart-section">
          <div class="cart-list">
            <article class="cart-item">
              <div class="product-media photo-media cart-thumb"><img src="assets/detail/detail-hero.png" alt="购物车中的莓红雕刻蜡烛"></div>
              <div class="cart-info">
                <div class="tag-row"><span class="tag berry">进阶</span><span class="tag">M 号</span></div>
                <h3>莓果洛可可 · 手工雕刻香薰蜡烛</h3>
                <p class="cart-meta-list">M · 约 7 x 10 cm<br>玫瑰木：红莓 / 玫瑰木 / 琥珀<br>经典卷边 · 礼盒包装 +20 · 空白贺卡</p>
                <button class="config-toggle" type="button" data-cart-config-toggle aria-expanded="false">修改配置</button>
                <div class="qty-row">
                  <div class="price-line">价格待确认</div>
                  <div class="qty-control" aria-label="数量选择" data-cart-quantity-control><button type="button" aria-label="减少数量" data-cart-quantity-minus>−</button><span data-cart-quantity>1</span><button type="button" aria-label="增加数量" data-cart-quantity-plus>+</button></div>
                </div>
              </div>
            </article>

            <div class="cart-config-panel" data-cart-config hidden>
              <div class="cart-option-section">
                <strong>尺寸</strong>
                <div class="segmented compact" data-choice-group>
                  <button class="segment" data-choice aria-pressed="false">S · 6 x 8</button>
                  <button class="segment active" data-choice aria-pressed="true">M · 7 x 10</button>
                  <button class="segment" data-choice aria-pressed="false">L · 8 x 12</button>
                  <button class="segment" data-choice aria-pressed="false">XL · 10 x 15</button>
                </div>
              </div>
              <div class="cart-option-section">
                <strong>香型</strong>
                <div class="fragrance-strip small" data-choice-group>
                  <button class="fragrance-pill" type="button" data-choice aria-pressed="true">玫瑰木</button>
                  <button class="fragrance-pill" type="button" data-choice aria-pressed="false">白茶</button>
                  <button class="fragrance-pill" type="button" data-choice aria-pressed="false">无香陈列</button>
                </div>
                <p class="cart-fragrance-note">当前香调：前调红莓，中调玫瑰木，后调琥珀。完整香调只在修改配置时展开。</p>
              </div>
              <div class="cart-option-section">
                <strong>雕花</strong>
                <div class="segmented compact" data-choice-group>
                  <button class="segment active" data-choice aria-pressed="true">经典卷边</button>
                  <button class="segment" data-choice aria-pressed="false">花瓣层叠</button>
                  <button class="segment" data-choice aria-pressed="false">宫廷褶皱</button>
                </div>
              </div>
              <div class="cart-option-section">
                <strong>包装</strong>
                <div class="choice-grid two" data-choice-group>
                  <button class="choice-card compact" data-choice aria-pressed="false"><strong>精品包装</strong><span>进阶默认，补差 ¥0。</span></button>
                  <button class="choice-card compact" data-choice aria-pressed="true"><strong>礼盒包装</strong><span>当前选择，额外 +20。</span></button>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="section">
          <div class="info-card address-card" data-cart-address>
            <div class="address-head">
              <h3>收货地址</h3>
              <a class="link-small" href="address.html?from=cart">管理</a>
            </div>
            <button class="address-current" type="button" data-cart-address-toggle aria-expanded="false">
              <span data-cart-address-summary>请选择收货地址</span>
              <em>更换</em>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            </button>
            <div class="cart-address-list" data-cart-address-list hidden></div>
          </div>
        </section>

        <section class="section">
          <div class="info-card">
            <h3>配送与售后</h3>
            <p>预计 48 小时内发货。雕刻卷边为易损细节，默认加固包装；签收后如发现运输损坏，可联系客服处理。</p>
            <div class="overseas-box">
              <button class="choice-card compact overseas-toggle" type="button" data-overseas-toggle aria-pressed="false">
                <strong>发往中国内地以外</strong>
                <span>默认不选；如需跨境配送，请选择配送目的地。</span>
              </button>
              <div class="destination-panel" data-destination-panel hidden>
                <label class="field">
                  <span>配送目的地</span>
                  <input type="search" data-destination-search placeholder="搜索国家或地区">
                </label>
                <button class="destination-select" type="button" data-destination-select aria-expanded="false">
                  <span data-destination-label>请选择配送目的地</span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                <div class="destination-result compact" data-destination-result hidden></div>
                <p class="destination-selected" data-destination-selected>未选择配送目的地</p>
              </div>
            </div>
          </div>
        </section>

        <section class="section">
          <div class="info-card">
            <h3>订单金额</h3>
            <div class="summary-row"><span>商品小计</span><strong>待确认</strong></div>
            <div class="summary-row"><span>礼盒升级</span><strong>+¥20</strong></div>
            <div class="summary-row"><span>运费</span><strong data-shipping-fee>¥0</strong></div>
            <div class="summary-row"><span>应付合计</span><strong style="color: var(--rose); font-size: 18px;">待确认</strong></div>
          </div>
        </section>
      </div>

      <div class="sticky-cta single cart-submit-bar">
        <button class="btn primary" data-toast="已模拟提交，稍后确认最终价格">提交确认</button>
      </div>
      <nav class="tabbar" aria-label="底部导航">
        <a class="tab-item" data-tab="home" href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>首页</span></a>
        <a class="tab-item" data-tab="gift" href="gift.html#scene"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 12v8H4v-8"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/></svg><span>送礼</span></a>
        <a class="tab-item" data-tab="catalog" href="catalog.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h7v7H4z"/><path d="M13 4h7v7h-7z"/><path d="M4 13h7v7H4z"/><path d="M13 13h7v7h-7z"/></svg><span>商品</span></a>
        <a class="tab-item" data-tab="cart" href="cart.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/><path d="M3 4h2l3 12h10l3-8H7"/></svg><span>购物车</span></a>
        <a class="tab-item" data-tab="mine" href="mine.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 22a8 8 0 0 1 16 0"/></svg><span>我的</span></a>
      </nav>
      <div class="toast" data-toast-host role="status" aria-live="polite"></div>
    </section>
  </main>
  <script src="assets/app.js"></script>
</body>
</html>
