<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>发票管理 · 香薰雕刻蜡烛</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="mine">
  <main class="prototype-page">
    <section class="phone-shell" aria-label="发票管理页面视觉稿">
      <div class="wx-status"><span>11:26</span><span class="wx-dots"><span></span><span></span><span></span></span></div>
      <header class="wx-header">
        <a class="back-link" href="mine.html" aria-label="返回我的">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m15 18-6-6 6-6"/></svg>
        </a>
        <div>
          <h1>发票管理</h1>
          <span class="subtle-title">抬头 · 记录 · 说明</span>
        </div>
        <div class="capsule" aria-label="微信胶囊按钮">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8"/></svg>
        </div>
      </header>

      <div class="screen-scroll address-scroll">
        <section class="section">
          <div class="section-head">
            <h2 class="section-title serif">常用抬头</h2>
            <button class="link-small link-button" type="button" data-toast="新增发票抬头为静态入口">新增抬头</button>
          </div>
          <div class="points-log-list">
            <div class="points-log-row"><div><strong>个人</strong><span>周女士 · 默认</span></div><b>默认</b></div>
            <div class="points-log-row"><div><strong>公司抬头</strong><span>上海样板贸易有限公司</span></div><b>编辑</b></div>
          </div>
        </section>
        <section class="section">
          <div class="info-card">
            <h3>开票记录</h3>
            <div class="summary-row"><span>莓果洛可可礼盒订单</span><strong>待开票</strong></div>
            <div class="summary-row"><span>晨雾金蓝礼盒订单</span><strong>已开票</strong></div>
          </div>
        </section>
        <section class="section">
          <div class="info-card">
            <h3>开票说明</h3>
            <p>静态稿仅展示入口。真实开票需在订单完成后按平台规则提交抬头、税号和邮箱。</p>
          </div>
        </section>
      </div>

      <nav class="tabbar" aria-label="底部导航">
        <a class="tab-item" data-tab="home" href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>首页</span></a>
        <a class="tab-item" data-tab="gift" href="gift.html#scene"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 12v8H4v-8"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/></svg><span>送礼</span></a>
        <a class="tab-item" data-tab="catalog" href="catalog.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h7v7H4z"/><path d="M13 4h7v7h-7z"/><path d="M4 13h7v7H4z"/><path d="M13 13h7v7h-7z"/></svg><span>商品</span></a>
        <a class="tab-item" data-tab="cart" href="cart.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/><path d="M3 4h2l3 12h10l3-8H7"/></svg><span>购物车</span></a>
        <a class="tab-item" data-tab="mine" href="mine.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 22a8 8 0 0 1 16 0"/></svg><span>我的</span></a>
      </nav>
      <div class="toast" data-toast-host role="status" aria-live="polite"></div>
    </section>
  </main>
  <script src="assets/app.js"></script>
</body>
</html>
