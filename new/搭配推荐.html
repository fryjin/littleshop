<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>搭配推荐 - Wax Atelier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            stone: '#F7F6F2', ivory: '#FFFFF0', sage: '#8FA396',
                            apricot: '#F3E5D8', berry: '#8A2B46', text: '#333333', muted: '#888888'
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif SC"', 'serif'],
                        sans: ['system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #e5e7eb; }
        .app-container { background-color: #F7F6F2; }
    </style>
</head>
<body class="flex justify-center h-screen overflow-hidden text-brand-text">

    <div class="w-full h-full sm:w-[375px] sm:h-[812px] sm:my-auto sm:rounded-[40px] sm:border-[8px] border-gray-800 app-container flex flex-col relative overflow-hidden shadow-2xl font-sans">
        
        <div class="h-7 w-full flex justify-between items-center px-6 pt-2 text-xs font-medium text-gray-800 z-20 bg-brand-stone bg-opacity-90 absolute top-0">
            <span>10:16</span>
            <div class="flex space-x-1 items-center">
                <i data-lucide="signal" class="w-3 h-3"></i>
                <i data-lucide="wifi" class="w-3 h-3"></i>
                <i data-lucide="battery-full" class="w-4 h-4"></i>
            </div>
        </div>

        <header class="pt-10 pb-2 px-4 flex justify-between items-center sticky top-0 z-10 bg-brand-stone bg-opacity-95 border-b border-gray-200/50">
            <div class="w-8 flex items-center cursor-pointer" onclick="history.back()">
                <i data-lucide="chevron-left" class="w-6 h-6 text-brand-text"></i>
            </div>
            <h1 class="text-lg font-bold font-serif">搭配推荐</h1>
            <div class="w-8"></div>
        </header>

        <main class="flex-1 overflow-y-auto no-scrollbar">
            
            <!-- 顶部引言 -->
            <div class="px-6 py-6 text-center">
                <h2 class="text-xl font-serif font-bold mb-2">为空间注入灵魂</h2>
                <p class="text-xs text-brand-muted leading-relaxed">探索精心设计的搭配组合，让光影与香气在不同场景中完美呈现。</p>
            </div>

            <!-- 搭配方案流 -->
            <div class="px-4 space-y-6 pb-10">
                
                <!-- 方案 1 -->
                <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
                    <!-- 场景大图 -->
                    <div class="w-full h-56 bg-[#EBE7DF] relative flex items-center justify-center">
                        <span class="text-sm text-brand-sage/50 font-serif">晚餐餐桌陈列场景图</span>
                        <!-- 图片上的商品锚点 (可选) -->
                        <div class="absolute bottom-6 left-1/3 w-2 h-2 bg-white rounded-full shadow-[0_0_0_4px_rgba(255,255,255,0.3)] animate-pulse"></div>
                    </div>
                    
                    <div class="p-4">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h3 class="font-serif font-bold text-base">古典晚宴之光</h3>
                                <p class="text-xs text-gray-500 mt-0.5">高低错落的直筒蜡烛，搭配复古黄铜烛台</p>
                            </div>
                        </div>

                        <!-- 组合包含的商品 -->
                        <div class="bg-gray-50 rounded-xl p-3 space-y-3">
                            <div class="flex justify-between items-center">
                                <div class="flex items-center space-x-3">
                                    <div class="w-10 h-10 bg-[#F3E5D8] rounded flex-shrink-0"></div>
                                    <div>
                                        <span class="text-xs font-medium block">复古黄铜烛台 (高款)</span>
                                        <span class="text-[10px] text-gray-400 block mt-0.5">x 1</span>
                                    </div>
                                </div>
                                <span class="text-xs font-serif font-bold">¥129.00</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <div class="flex items-center space-x-3">
                                    <div class="w-10 h-10 bg-[#E8EAE6] rounded flex-shrink-0"></div>
                                    <div>
                                        <span class="text-xs font-medium block">经典直筒蜡烛 (勃艮第红)</span>
                                        <span class="text-[10px] text-gray-400 block mt-0.5">x 2</span>
                                    </div>
                                </div>
                                <span class="text-xs font-serif font-bold">¥398.00</span>
                            </div>
                        </div>

                        <div class="mt-4 flex justify-between items-center">
                            <div class="text-xs text-gray-500">组合价: <span class="text-brand-berry font-bold font-serif text-sm ml-1">¥499.00</span></div>
                            <button onclick="showToast('组合已加入购物车')" class="bg-brand-text text-white text-xs px-4 py-2 rounded-full font-medium hover:bg-black transition-colors">一键加购</button>
                        </div>
                    </div>
                </div>

                <!-- 方案 2 -->
                <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
                    <div class="w-full h-56 bg-[#F3E5D8] relative flex items-center justify-center">
                        <span class="text-sm text-brand-sage/50 font-serif">茶几/边几休憩场景图</span>
                    </div>
                    
                    <div class="p-4">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <h3 class="font-serif font-bold text-base">角落的宁静</h3>
                                <p class="text-xs text-gray-500 mt-0.5">异形香薰蜡烛搭配原木托盘</p>
                            </div>
                        </div>

                        <div class="bg-gray-50 rounded-xl p-3 space-y-3">
                            <div class="flex justify-between items-center">
                                <div class="flex items-center space-x-3">
                                    <div class="w-10 h-10 bg-white border border-gray-100 rounded flex-shrink-0"></div>
                                    <div>
                                        <span class="text-xs font-medium block">黑胡桃木托盘</span>
                                        <span class="text-[10px] text-gray-400 block mt-0.5">x 1</span>
                                    </div>
                                </div>
                                <span class="text-xs font-serif font-bold">¥89.00</span>
                            </div>
                            <div class="flex justify-between items-center">
                                <div class="flex items-center space-x-3">
                                    <div class="w-10 h-10 bg-[#E8EAE6] rounded flex-shrink-0"></div>
                                    <div>
                                        <span class="text-xs font-medium block">岩石纹理香薰蜡</span>
                                        <span class="text-[10px] text-gray-400 block mt-0.5">x 1</span>
                                    </div>
                                </div>
                                <span class="text-xs font-serif font-bold">¥259.00</span>
                            </div>
                        </div>

                        <div class="mt-4 flex justify-between items-center">
                            <div class="text-xs text-gray-500">组合价: <span class="text-brand-berry font-bold font-serif text-sm ml-1">¥329.00</span></div>
                            <button onclick="showToast('组合已加入购物车')" class="bg-brand-text text-white text-xs px-4 py-2 rounded-full font-medium hover:bg-black transition-colors">一键加购</button>
                        </div>
                    </div>
                </div>

            </div>
            
        </main>

        <div id="toast" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white text-sm px-6 py-3 rounded-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 text-center"></div>

    </div>

    <script>
        lucide.createIcons();
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }
    </script>
</body>
</html>
