<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>送礼助手 - Wax Atelier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            stone: '#F7F6F2',
                            ivory: '#FFFFF0',
                            sage: '#8FA396',
                            apricot: '#F3E5D8',
                            berry: '#8A2B46',
                            text: '#333333',
                            muted: '#888888'
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif SC"', 'serif'],
                        sans: ['system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #e5e7eb; }
        .app-container { background-color: #F7F6F2; }
        
        /* 选中状态样式 */
        .filter-btn.active {
            background-color: #8FA396;
            color: white;
            border-color: #8FA396;
        }
    </style>
</head>
<body class="flex justify-center h-screen overflow-hidden text-brand-text">

    <div class="w-full h-full sm:w-[375px] sm:h-[812px] sm:my-auto sm:rounded-[40px] sm:border-[8px] border-gray-800 app-container flex flex-col relative overflow-hidden shadow-2xl font-sans">
        
        <!-- 顶部状态栏 -->
        <div class="h-7 w-full flex justify-between items-center px-6 pt-2 text-xs font-medium text-gray-800 z-20 bg-brand-stone bg-opacity-90 backdrop-blur-sm absolute top-0">
            <span>10:16</span>
            <div class="flex space-x-1 items-center">
                <i data-lucide="signal" class="w-3 h-3"></i>
                <i data-lucide="wifi" class="w-3 h-3"></i>
                <i data-lucide="battery-full" class="w-4 h-4"></i>
            </div>
        </div>

        <!-- 导航栏 -->
        <header class="pt-10 pb-2 px-4 flex justify-between items-center sticky top-0 z-10 bg-brand-stone bg-opacity-95 backdrop-blur-md">
            <div class="w-8 flex items-center cursor-pointer" onclick="goBack('商城首页.html')">
                <i data-lucide="chevron-left" class="w-6 h-6 text-brand-text"></i>
            </div>
            <h1 class="text-lg font-bold font-serif">送礼助手</h1>
            <div class="w-8"></div>
        </header>

        <main class="flex-1 overflow-y-auto no-scrollbar relative">
            
            <!-- 紧凑筛选区 (固定在顶部) -->
            <div class="sticky top-0 bg-brand-stone z-10 pb-3 border-b border-gray-200/50 shadow-sm">
                <!-- 预算区间 -->
                <div class="px-4 py-1.5 flex items-center overflow-x-auto no-scrollbar space-x-2">
                    <span class="text-xs text-brand-muted flex-shrink-0 mr-1">预算:</span>
                    <button class="budget-chip filter-btn active flex-shrink-0 px-3 py-1 text-xs rounded-full border border-gray-300 text-brand-text transition-colors" onclick="selectPresetBudget(this, '¥200 - ¥500')">¥200-500</button>
                    <button class="budget-chip filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full border border-gray-300 text-brand-text transition-colors" onclick="selectPresetBudget(this, '¥500 - ¥800')">¥500-800</button>
                    <button class="budget-chip filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full border border-gray-300 text-brand-text transition-colors" onclick="selectPresetBudget(this, '¥800+')">¥800+</button>
                    <button class="budget-chip filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full border border-gray-300 text-brand-text transition-colors" onclick="selectPresetBudget(this, '不限预算')">不限</button>
                    <button class="budget-chip filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full border border-gray-300 text-brand-text transition-colors" onclick="toggleBudgetDrawer()">自定义</button>
                    <span class="text-xs text-brand-berry font-bold font-serif flex-shrink-0 pl-1" id="current-budget">¥200 - ¥500</span>
                </div>

                <!-- 场景横向滑动 -->
                <div class="px-4 py-1.5 flex items-center overflow-x-auto no-scrollbar space-x-2">
                    <span class="text-xs text-brand-muted flex-shrink-0 mr-1">场景:</span>
                    <button class="filter-btn active flex-shrink-0 px-3 py-1 text-xs rounded-full border border-gray-300 text-brand-text transition-colors">不限</button>
                    <button class="filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full border border-gray-300 text-brand-text transition-colors">伴手礼</button>
                    <button class="filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full border border-gray-300 text-brand-text transition-colors">乔迁</button>
                    <button class="filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full border border-gray-300 text-brand-text transition-colors">生日</button>
                    <button class="filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full border border-gray-300 text-brand-text transition-colors">商务</button>
                </div>

                <!-- 节日横向滑动 -->
                <div class="px-4 py-1.5 flex items-center overflow-x-auto no-scrollbar space-x-2">
                    <span class="text-xs text-brand-muted flex-shrink-0 mr-1">节日:</span>
                    <button class="filter-btn active flex-shrink-0 px-3 py-1 text-xs rounded-full border border-gray-300 text-brand-text transition-colors">不限</button>
                    <button class="filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full border border-gray-300 text-brand-text transition-colors">情人节</button>
                    <button class="filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full border border-gray-300 text-brand-text transition-colors">圣诞节</button>
                    <button class="filter-btn flex-shrink-0 px-3 py-1 text-xs rounded-full border border-gray-300 text-brand-text transition-colors">母亲节</button>
                </div>
            </div>

            <!-- 推荐列表 (单列展示) -->
            <div class="p-4 space-y-4">
                
                <!-- 推荐商品 1 -->
                <div class="bg-white rounded-xl p-3 flex space-x-4 shadow-sm border border-transparent hover:border-brand-sage/30 transition-all cursor-pointer" onclick="goPage('商品详情页.html')">
                    <div class="w-24 h-24 bg-[#EBE7DF] rounded-lg flex-shrink-0 flex items-center justify-center relative">
                        <span class="text-[10px] text-brand-sage/50">商品图</span>
                    </div>
                    <div class="flex-1 flex flex-col justify-between py-1">
                        <div>
                            <h3 class="font-serif font-bold text-sm text-brand-text line-clamp-1">冬日暖阳双支礼盒</h3>
                            <p class="text-[11px] text-brand-muted mt-1 line-clamp-2">包含两支经典直筒蜡烛，附赠定制火柴包，适合作为贴心伴手礼。</p>
                        </div>
                        <div class="flex justify-between items-end mt-2">
                            <span class="text-brand-berry font-bold text-sm font-serif">¥399.00</span>
                            <button onclick="addPrototypeCart(event)" class="w-7 h-7 bg-brand-stone rounded-full flex items-center justify-center text-brand-text hover:bg-brand-sage hover:text-white transition-colors">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 推荐商品 2 -->
                <div class="bg-white rounded-xl p-3 flex space-x-4 shadow-sm border border-transparent hover:border-brand-sage/30 transition-all cursor-pointer" onclick="goPage('商品详情页.html')">
                    <div class="w-24 h-24 bg-[#F3E5D8] rounded-lg flex-shrink-0 flex items-center justify-center relative">
                        <span class="text-[10px] text-brand-sage/50">商品图</span>
                    </div>
                    <div class="flex-1 flex flex-col justify-between py-1">
                        <div>
                            <h3 class="font-serif font-bold text-sm text-brand-text line-clamp-1">繁花复古卷边蜡烛</h3>
                            <p class="text-[11px] text-brand-muted mt-1 line-clamp-2">进阶手工雕刻，复杂的花纹适合乔迁之喜或高级桌面陈列。</p>
                        </div>
                        <div class="flex justify-between items-end mt-2">
                            <span class="text-brand-berry font-bold text-sm font-serif">¥459.00</span>
                            <button onclick="addPrototypeCart(event)" class="w-7 h-7 bg-brand-stone rounded-full flex items-center justify-center text-brand-text hover:bg-brand-sage hover:text-white transition-colors">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>

                 <!-- 推荐商品 3 -->
                 <div class="bg-white rounded-xl p-3 flex space-x-4 shadow-sm border border-transparent hover:border-brand-sage/30 transition-all cursor-pointer" onclick="goPage('商品详情页.html')">
                    <div class="w-24 h-24 bg-[#E8EAE6] rounded-lg flex-shrink-0 flex items-center justify-center relative">
                        <span class="text-[10px] text-brand-sage/50">商品图</span>
                    </div>
                    <div class="flex-1 flex flex-col justify-between py-1">
                        <div>
                            <h3 class="font-serif font-bold text-sm text-brand-text line-clamp-1">微光初现单支装</h3>
                            <p class="text-[11px] text-brand-muted mt-1 line-clamp-2">极简设计，适合作为无负担的小礼物。</p>
                        </div>
                        <div class="flex justify-between items-end mt-2">
                            <span class="text-brand-berry font-bold text-sm font-serif">¥229.00</span>
                            <button onclick="addPrototypeCart(event)" class="w-7 h-7 bg-brand-stone rounded-full flex items-center justify-center text-brand-text hover:bg-brand-sage hover:text-white transition-colors">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="text-center text-xs text-brand-muted py-4">已经到底啦</div>
            </div>
            
        </main>

        <!-- 底部预算选择抽屉 (默认隐藏) -->
        <div id="budget-drawer" class="absolute inset-0 bg-black/40 z-40 hidden flex-col justify-end transition-opacity duration-300 opacity-0">
            <div class="bg-white rounded-t-2xl w-full p-4 transform translate-y-full transition-transform duration-300" id="budget-content">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-base">修改预算范围</h3>
                    <i data-lucide="x" class="w-5 h-5 text-gray-400 cursor-pointer" onclick="toggleBudgetDrawer()"></i>
                </div>
                
                <div class="mb-6">
                    <div class="rounded-xl bg-brand-stone p-4">
                        <div class="flex justify-between items-center mb-5">
                            <span class="text-xs text-gray-500">预算上限</span>
                            <span id="custom-budget-label" class="text-sm font-bold text-brand-berry font-serif">¥800 内</span>
                        </div>
                        <input id="budget-range" type="range" min="100" max="1500" step="50" value="800" class="w-full accent-brand-sage" oninput="syncCustomBudget()">
                        <div class="flex justify-between text-[10px] text-gray-400 mt-3">
                            <span>¥100</span>
                            <span>¥500</span>
                            <span>¥900</span>
                            <span>¥1300</span>
                            <span>¥1500</span>
                        </div>
                    </div>
                </div>
                
                <button onclick="confirmCustomBudget()" class="w-full bg-brand-text text-white py-3 rounded-lg font-medium text-sm mb-4">确认区间</button>
            </div>
        </div>

        <div id="toast" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white text-sm px-6 py-3 rounded-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50">
            提示信息
        </div>

    </div>

    <script>
        lucide.createIcons();

        // 简易单选交互逻辑
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // 找到同组（兄弟节点）中的所有按钮，移除 active
                Array.from(this.parentElement.children).forEach(sibling => {
                    if(sibling.classList.contains('filter-btn')) {
                        sibling.classList.remove('active');
                    }
                });
                // 为当前点击的按钮添加 active
                this.classList.add('active');
            });
        });

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }

        // 抽屉逻辑
        const drawer = document.getElementById('budget-drawer');
        const content = document.getElementById('budget-content');
        let isDrawerOpen = false;

        function toggleBudgetDrawer() {
            if (isDrawerOpen) {
                content.classList.add('translate-y-full');
                drawer.classList.remove('opacity-100');
                setTimeout(() => {
                    drawer.classList.add('hidden');
                    drawer.classList.remove('flex');
                }, 300);
            } else {
                drawer.classList.remove('hidden');
                drawer.classList.add('flex');
                // 触发重绘
                void drawer.offsetWidth;
                drawer.classList.add('opacity-100');
                content.classList.remove('translate-y-full');
            }
            isDrawerOpen = !isDrawerOpen;
        }

        function selectPresetBudget(button, label) {
            document.querySelectorAll('.budget-chip').forEach(chip => {
                chip.classList.remove('active');
            });
            button.classList.add('active');
            document.getElementById('current-budget').textContent = label;
        }

        function syncCustomBudget() {
            const max = Number(document.getElementById('budget-range').value);
            document.getElementById('custom-budget-label').textContent = '¥' + max + ' 内';
        }

        function confirmCustomBudget() {
            syncCustomBudget();
            const label = document.getElementById('custom-budget-label').textContent;
            document.getElementById('current-budget').textContent = label;
            document.querySelectorAll('.budget-chip').forEach(chip => {
                chip.classList.remove('active');
            });
            toggleBudgetDrawer();
        }
    </script>
    <script src="assets/prototype-state.js"></script>
</body>
</html>
