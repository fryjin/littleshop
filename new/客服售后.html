<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>客服售后 - Wax Atelier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            stone: '#F7F6F2', ivory: '#FFFFF0', sage: '#8FA396',
                            apricot: '#F3E5D8', berry: '#8A2B46', text: '#333333', muted: '#888888'
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif SC"', 'serif'],
                        sans: ['system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #e5e7eb; }
        .app-container { background-color: #F7F6F2; }
    </style>
</head>
<body class="flex justify-center h-screen overflow-hidden text-brand-text">

    <!-- 模拟手机屏幕的容器 -->
    <div class="w-full h-full sm:w-[375px] sm:h-[812px] sm:my-auto sm:rounded-[40px] sm:border-[8px] border-gray-800 app-container flex flex-col relative overflow-hidden shadow-2xl font-sans bg-brand-stone">
        
        <!-- 顶部状态栏 (模拟) -->
        <div class="h-7 w-full flex justify-between items-center px-6 pt-2 text-xs font-medium text-gray-800 z-20 bg-white/95 backdrop-blur-md absolute top-0">
            <span>10:16</span>
            <div class="flex space-x-1 items-center">
                <i data-lucide="signal" class="w-3 h-3"></i>
                <i data-lucide="wifi" class="w-3 h-3"></i>
                <i data-lucide="battery-full" class="w-4 h-4"></i>
            </div>
        </div>

        <!-- 客服头部导航 -->
        <header class="pt-10 pb-3.5 px-4 bg-white border-b border-gray-100 flex items-center justify-between sticky top-0 z-10">
            <div class="w-8 flex items-center cursor-pointer" onclick="goBack('我的.html')">
                <i data-lucide="chevron-left" class="w-6 h-6 text-brand-text"></i>
            </div>
            <div class="text-center">
                <h1 class="text-sm font-bold font-serif leading-none">顾问 · 晴子</h1>
                <span class="text-[9px] text-brand-sage flex items-center justify-center gap-1 mt-1 font-medium">
                    <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-ping"></span> 线上解答中
                </span>
            </div>
            <div class="w-8 text-right cursor-pointer" onclick="toggleQuickMenu()">
                <i data-lucide="menu" class="w-5 h-5 text-gray-600"></i>
            </div>
        </header>

        <!-- 聊天信息展示滚动区域 -->
        <main id="chat-scroller" class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-4 pb-20">
            
            <div class="text-center py-2 text-[10px] text-gray-400">2026-06-04 10:16</div>

            <!-- 客服消息 1 (自动欢迎语) -->
            <div class="flex items-start gap-2.5 max-w-[85%]">
                <div class="w-8 h-8 rounded-full bg-brand-sage/20 border border-brand-sage/10 flex items-center justify-center flex-shrink-0 text-brand-sage">
                    <i data-lucide="user-check" class="w-4 h-4"></i>
                </div>
                <div class="bg-white rounded-2xl rounded-tl-sm p-3.5 text-xs text-brand-text leading-relaxed shadow-sm">
                    您好，我是您的专属顾问 **晴子**。很高兴能在 Wax Atelier 与您相遇。🌾
                    <br><br>
                    请问有什么我可以帮您的？可以随时点击下方快速选项，或输入您的诉求：
                    
                    <!-- 快捷功能服务菜单 -->
                    <div class="mt-3.5 space-y-2 border-t border-gray-50 pt-3">
                        <div onclick="triggerConsultation('delivery')" class="flex items-center justify-between text-brand-sage font-medium cursor-pointer py-1.5 hover:px-1 transition-all">
                            <span>📦 零售订单顺丰进度查询</span>
                            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                        </div>
                        <div onclick="triggerConsultation('custom')" class="flex items-center justify-between text-brand-sage font-medium cursor-pointer py-1.5 hover:px-1 transition-all">
                            <span>🕯️ 独立品牌蜡烛高级定制</span>
                            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                        </div>
                        <div onclick="triggerAftersalesForm()" class="flex items-center justify-between text-brand-berry font-medium cursor-pointer py-1.5 hover:px-1 transition-all">
                            <span>⚠️ 运输破损 / 申请补发单</span>
                            <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-brand-berry"></i>
                        </div>
                        <div onclick="triggerConsultation('wholesale')" class="flex items-center justify-between text-brand-sage font-medium cursor-pointer py-1.5 hover:px-1 transition-all">
                            <span>💼 渠道/大宗拿样政策解答</span>
                            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 新增动态对话注入占位 -->
            <div id="dynamic-chat-anchor" class="space-y-4"></div>

        </main>

        <!-- 售后补寄单申请面板 (点击破损后出现，纯前端演示) -->
        <div id="aftersales-panel" class="absolute inset-x-0 bottom-0 bg-white rounded-t-2xl z-40 hidden flex-col border-t border-gray-100 shadow-2xl transition-transform duration-300 translate-y-full">
            <div class="px-4 py-3 border-b border-gray-50 flex justify-between items-center">
                <h3 class="text-xs font-bold font-serif flex items-center gap-1.5 text-brand-berry"><i data-lucide="shield-alert" class="w-4 h-4"></i> 运输破损补寄申报表</h3>
                <i data-lucide="x" class="w-5 h-5 text-gray-400 cursor-pointer" onclick="toggleAftersalesPanel(false)"></i>
            </div>
            <form class="p-4 space-y-3 text-xs" onsubmit="submitAftersalesReport(event)">
                <div class="space-y-1">
                    <label class="text-gray-400 block font-medium">关联零售订单号 <span class="text-brand-berry">*</span></label>
                    <input required type="text" placeholder="例如: WAX20260601004" class="w-full bg-brand-stone rounded-lg px-3 py-2 text-brand-text font-mono focus:outline-none border border-transparent focus:border-brand-sage">
                </div>
                
                <div class="space-y-1">
                    <label class="text-gray-400 block font-medium">破损情况说明 <span class="text-brand-berry">*</span></label>
                    <textarea rows="2" required placeholder="如：蜡烛头部断裂、包装严重变形等" class="w-full bg-brand-stone rounded-lg px-3 py-2 text-brand-text focus:outline-none border border-transparent focus:border-brand-sage resize-none"></textarea>
                </div>

                <!-- 模拟上传凭证 -->
                <div class="space-y-1">
                    <label class="text-gray-400 block font-medium">破损实物图片凭证 <span class="text-brand-berry">*</span></label>
                    <div class="flex gap-2">
                        <div onclick="showToast('模拟调起手机摄像头与相册')" class="w-16 h-16 bg-brand-stone rounded-lg flex flex-col items-center justify-center border border-dashed border-gray-300 text-gray-400 cursor-pointer hover:bg-gray-50">
                            <i data-lucide="camera" class="w-4 h-4"></i>
                            <span class="text-[8px] mt-1">上传</span>
                        </div>
                        <div class="w-16 h-16 bg-gray-100 rounded-lg flex items-center justify-center text-gray-400 text-[10px] relative border border-gray-200">
                            [预览图]
                            <div class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full flex items-center justify-center text-white text-[8px]">×</div>
                        </div>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-brand-berry text-white py-3 rounded-full font-medium text-xs shadow-md">提交破损申请</button>
                </div>
            </form>
        </div>

        <!-- 底部消息输入区域 -->
        <div class="absolute bottom-0 w-full bg-white border-t border-gray-100 pb-safe pt-2.5 px-3 z-30 flex items-center gap-3">
            <button onclick="showToast('微信语音输入已启动')" class="w-9 h-9 rounded-full bg-brand-stone flex items-center justify-center text-gray-500 hover:bg-gray-100">
                <i data-lucide="mic" class="w-4 h-4"></i>
            </button>
            <input id="chat-input" type="text" placeholder="给顾问晴子留言..." class="flex-1 bg-brand-stone text-xs h-9 rounded-full px-4 focus:outline-none border border-transparent focus:border-brand-sage/30">
            <button onclick="sendUserMessage()" class="w-9 h-9 rounded-full bg-brand-sage text-white flex items-center justify-center hover:bg-brand-sage/90">
                <i data-lucide="send" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- 模拟快捷服务菜单抽屉 -->
        <div id="quick-drawer" class="absolute right-4 top-16 bg-white/95 backdrop-blur border border-gray-100 shadow-xl rounded-xl p-2.5 z-40 hidden flex-col gap-1.5 text-xs w-36">
            <div onclick="window.location.href='商城首页.html'" class="flex items-center gap-2 py-1.5 px-2 hover:bg-gray-50 rounded cursor-pointer text-gray-600"><i data-lucide="home" class="w-3.5 h-3.5"></i> 官方首页</div>
            <div onclick="window.location.href='订单列表.html'" class="flex items-center gap-2 py-1.5 px-2 hover:bg-gray-50 rounded cursor-pointer text-gray-600"><i data-lucide="package" class="w-3.5 h-3.5"></i> 全部订单</div>
            <div onclick="window.location.href='渠道合作申请.html'" class="flex items-center gap-2 py-1.5 px-2 hover:bg-gray-50 rounded cursor-pointer text-gray-600"><i data-lucide="briefcase" class="w-3.5 h-3.5"></i> 批发通道</div>
        </div>

        <div id="toast" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white text-xs px-6 py-3 rounded-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 text-center max-w-[80%]"></div>

    </div>

    <script>
        lucide.createIcons();

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }

        function toggleQuickMenu() {
            const drawer = document.getElementById('quick-drawer');
            drawer.classList.toggle('hidden');
        }

        // 打开或收起售后申请表单
        const aftersalesPanel = document.getElementById('aftersales-panel');
        function toggleAftersalesPanel(show) {
            if (show) {
                aftersalesPanel.classList.remove('hidden');
                void aftersalesPanel.offsetWidth;
                aftersalesPanel.classList.remove('translate-y-full');
            } else {
                aftersalesPanel.classList.add('translate-y-full');
                setTimeout(() => aftersalesPanel.classList.add('hidden'), 300);
            }
        }

        function triggerAftersalesForm() {
            toggleAftersalesPanel(true);
        }

        // 提交售后申请汇报
        function submitAftersalesReport(event) {
            event.preventDefault();
            toggleAftersalesPanel(false);
            
            // 往聊天对话流中注入提交成功的顾问答复
            const anchor = document.getElementById('dynamic-chat-anchor');
            
            const submitMsg = `
                <div class="flex items-start justify-end gap-2.5 max-w-[85%] ml-auto">
                    <div class="bg-brand-sage text-white rounded-2xl rounded-tr-sm p-3.5 text-xs leading-relaxed shadow-sm">
                        我已上传了订单的破损照片，希望能够进行破损补寄。
                    </div>
                </div>
                <div class="flex items-start gap-2.5 max-w-[85%]">
                    <div class="w-8 h-8 rounded-full bg-brand-sage/20 border border-brand-sage/10 flex items-center justify-center flex-shrink-0 text-brand-sage">
                        <i data-lucide="user-check" class="w-4 h-4"></i>
                    </div>
                    <div class="bg-white rounded-2xl rounded-tl-sm p-3.5 text-xs text-brand-text leading-relaxed shadow-sm">
                        好的，我已经收到了您的 **破损寄件申请**。
                        <br><br>
                        质检售后部将在 2 小时内完成照片凭证合规审核，一经确认我们将为您极速进行顺丰重新包邮补发。请留意短信通知。
                    </div>
                </div>
            `;
            anchor.innerHTML += submitMsg;
            lucide.createIcons();
            scrollToBottom();
        }

        // 点击快捷菜单调起模拟回复
        function triggerConsultation(type) {
            const anchor = document.getElementById('dynamic-chat-anchor');
            let userContent = "";
            let replyContent = "";

            if (type === 'delivery') {
                userContent = "我想查询下我最近零售订单的配送状态";
                replyContent = "您好！目前您最近一笔订购的 **勃艮第红复古卷边蜡烛**（订单号WAX20260601004）已由上海徐汇仓发出，交由顺丰速运承运，预计将于明日18:00前送达。请保持电话通畅。";
            } else if (type === 'custom') {
                userContent = "关于品牌香薰蜡烛定制，有什么要求吗？";
                replyContent = "我们承接高档活动礼品、婚礼香薰专属定制。支持：1.色系搭配微调；2.特调香型（经典浆果、冬日木香、沉香无香）；3.烛台高级底座木刻字。请添加主理人专线或在此留言您的数量及日期。";
            } else if (type === 'wholesale') {
                userContent = "我想咨询下大宗拿样包的政策与价格折扣";
                replyContent = "为了方便商业伙伴看样，我们推出 3/6/12 款经典雕刻系列拿样体验包。提交 **[我的 -> 申请渠道身份]** 并审核通过后，该样包的款项将在您后续首单货款中进行全额抵扣和免除。";
            }

            const dynamicHtml = `
                <div class="flex items-start justify-end gap-2.5 max-w-[85%] ml-auto animate-fadeIn">
                    <div class="bg-brand-sage text-white rounded-2xl rounded-tr-sm p-3.5 text-xs leading-relaxed shadow-sm">
                        ${userContent}
                    </div>
                </div>
                <div class="flex items-start gap-2.5 max-w-[85%] animate-fadeIn">
                    <div class="w-8 h-8 rounded-full bg-brand-sage/20 border border-brand-sage/10 flex items-center justify-center flex-shrink-0 text-brand-sage">
                        <i data-lucide="user-check" class="w-4 h-4"></i>
                    </div>
                    <div class="bg-white rounded-2xl rounded-tl-sm p-3.5 text-xs text-brand-text leading-relaxed shadow-sm">
                        ${replyContent}
                    </div>
                </div>
            `;
            anchor.innerHTML += dynamicHtml;
            lucide.createIcons();
            scrollToBottom();
        }

        // 模拟手动输入消息并发送
        function sendUserMessage() {
            const input = document.getElementById('chat-input');
            const anchor = document.getElementById('dynamic-chat-anchor');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';

            const userHtml = `
                <div class="flex items-start justify-end gap-2.5 max-w-[85%] ml-auto">
                    <div class="bg-brand-sage text-white rounded-2xl rounded-tr-sm p-3.5 text-xs leading-relaxed shadow-sm">
                        ${text}
                    </div>
                </div>
            `;
            anchor.innerHTML += userHtml;
            scrollToBottom();

            // 1秒后模拟客服温馨自动套语答复
            setTimeout(() => {
                const tutorHtml = `
                    <div class="flex items-start gap-2.5 max-w-[85%]">
                        <div class="w-8 h-8 rounded-full bg-brand-sage/20 border border-brand-sage/10 flex items-center justify-center flex-shrink-0 text-brand-sage">
                            <i data-lucide="user-check" class="w-4 h-4"></i>
                        </div>
                        <div class="bg-white rounded-2xl rounded-tl-sm p-3.5 text-xs text-brand-text leading-relaxed shadow-sm">
                            收到您的咨询！“${text}”相关事宜，我们的专业产品专员已在飞速查看中，由于目前手工订单排产密集，可能会有短暂回复延迟。如果您有紧急定制需求，推荐直接致电主理人顾问电话或点击上方菜单查看大宗说明。
                        </div>
                    </div>
                `;
                anchor.innerHTML += tutorHtml;
                lucide.createIcons();
                scrollToBottom();
            }, 1000);
        }

        function scrollToBottom() {
            const scroller = document.getElementById('chat-scroller');
            scroller.scrollTop = scroller.scrollHeight;
        }
    </script>
    <script src="assets/prototype-state.js"></script>
</body>
</html>
