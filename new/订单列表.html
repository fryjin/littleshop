<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的订单 - Wax Atelier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            stone: '#F7F6F2', ivory: '#FFFFF0', sage: '#8FA396',
                            apricot: '#F3E5D8', berry: '#8A2B46', text: '#333333', muted: '#888888'
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif SC"', 'serif'],
                        sans: ['system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #e5e7eb; }
        .app-container { background-color: #F7F6F2; }
    </style>
</head>
<body class="flex justify-center h-screen overflow-hidden text-brand-text">

    <div class="w-full h-full sm:w-[375px] sm:h-[812px] sm:my-auto sm:rounded-[40px] sm:border-[8px] border-gray-800 app-container flex flex-col relative overflow-hidden shadow-2xl font-sans">
        
        <!-- 顶部状态栏 (模拟) -->
        <div class="h-7 w-full flex justify-between items-center px-6 pt-2 text-xs font-medium text-gray-800 z-20 bg-brand-stone bg-opacity-90 absolute top-0">
            <span>10:16</span>
            <div class="flex space-x-1 items-center">
                <i data-lucide="signal" class="w-3 h-3"></i>
                <i data-lucide="wifi" class="w-3 h-3"></i>
                <i data-lucide="battery-full" class="w-4 h-4"></i>
            </div>
        </div>

        <!-- 导航栏 -->
        <header class="pt-10 pb-2 px-4 flex justify-between items-center sticky top-0 z-10 bg-brand-stone bg-opacity-95 border-b border-gray-200/50">
            <div class="w-8 flex items-center cursor-pointer" onclick="window.location.href='我的.html'">
                <i data-lucide="chevron-left" class="w-6 h-6 text-brand-text"></i>
            </div>
            <h1 class="text-lg font-bold font-serif">我的订单</h1>
            <div class="w-8"></div>
        </header>

        <!-- 状态切换 Tabs -->
        <div class="bg-white flex justify-between px-4 py-3 text-xs border-b border-gray-100 z-10">
            <span class="font-bold text-brand-sage border-b-2 border-brand-sage pb-1 cursor-pointer" onclick="switchOrderTab(this, 'all')">全部</span>
            <span class="text-gray-400 pb-1 cursor-pointer" onclick="switchOrderTab(this, 'unpaid')">待付款</span>
            <span class="text-gray-400 pb-1 cursor-pointer" onclick="switchOrderTab(this, 'unshipped')">待发货</span>
            <span class="text-gray-400 pb-1 cursor-pointer" onclick="switchOrderTab(this, 'unreceived')">待收货</span>
            <span class="text-gray-400 pb-1 cursor-pointer" onclick="switchOrderTab(this, 'completed')">已完成</span>
        </div>

        <!-- 订单列表滚动区域 -->
        <main class="flex-1 overflow-y-auto no-scrollbar p-3 space-y-3 pb-8">
            
            <!-- 订单 1：待付款 (零售) -->
            <div class="bg-white rounded-xl p-4 shadow-sm border border-transparent hover:border-brand-sage/20 transition-all duration-300" data-status="unpaid">
                <div class="flex justify-between items-center pb-2.5 border-b border-gray-50 mb-3 text-xs">
                    <span class="text-gray-400">订单号: WAX20260603091</span>
                    <span class="text-brand-berry font-bold">待付款</span>
                </div>
                
                <!-- 商品明细 -->
                <div class="flex gap-3 mb-3">
                    <div class="w-16 h-16 bg-[#F3E5D8] rounded flex-shrink-0 flex items-center justify-center">
                        <span class="text-[8px] text-brand-sage/50">[商品图]</span>
                    </div>
                    <div class="flex-1 flex flex-col justify-between py-0.5">
                        <h4 class="text-xs font-bold line-clamp-1">勃艮第红复古卷边蜡烛</h4>
                        <p class="text-[10px] text-gray-400">标准版 | 浆果迷踪 | 水波纹</p>
                        <div class="flex justify-between items-center mt-1">
                            <span class="text-xs font-serif font-bold">¥259.00</span>
                            <span class="text-[10px] text-gray-400">x 1</span>
                        </div>
                    </div>
                </div>

                <div class="flex justify-between items-center pt-2.5 border-t border-gray-50 text-xs">
                    <span class="text-gray-400">共 1 件商品</span>
                    <div>
                        合计: <span class="text-brand-berry font-bold font-serif text-sm">¥259.00</span>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="flex justify-end space-x-2 mt-4 pt-1">
                    <button onclick="showToast('订单已取消')" class="px-4 py-1.5 rounded-full border border-gray-200 text-gray-400 text-[11px] hover:bg-gray-50 transition-colors">取消订单</button>
                    <button onclick="goPage('付款页面.html')" class="px-4 py-1.5 rounded-full bg-brand-text text-white text-[11px] font-medium hover:bg-black transition-colors">去付款</button>
                </div>
            </div>

            <!-- 订单 2：待发货 (零售礼盒) -->
            <div class="bg-white rounded-xl p-4 shadow-sm border border-transparent" data-status="unshipped">
                <div class="flex justify-between items-center pb-2.5 border-b border-gray-50 mb-3 text-xs">
                    <span class="text-gray-400">订单号: WAX20260601004</span>
                    <span class="text-brand-sage font-bold">待发货</span>
                </div>
                
                <div class="flex gap-3 mb-3">
                    <div class="w-16 h-16 bg-[#E8EAE6] rounded flex-shrink-0 flex items-center justify-center">
                        <span class="text-[8px] text-brand-sage/50">[商品图]</span>
                    </div>
                    <div class="flex-1 flex flex-col justify-between py-0.5">
                        <h4 class="text-xs font-bold line-clamp-1">冬日暖阳双支礼盒</h4>
                        <p class="text-[10px] text-gray-400">礼盒装 | 无香陈列</p>
                        <div class="flex justify-between items-center mt-1">
                            <span class="text-xs font-serif font-bold">¥399.00</span>
                            <span class="text-[10px] text-gray-400">x 1</span>
                        </div>
                    </div>
                </div>

                <div class="flex justify-between items-center pt-2.5 border-t border-gray-50 text-xs">
                    <span class="text-gray-400">共 1 件商品</span>
                    <div>
                        合计: <span class="text-brand-berry font-bold font-serif text-sm">¥399.00</span>
                    </div>
                </div>

                <div class="flex justify-end space-x-2 mt-4 pt-1">
                    <button onclick="showToast('已通知库房加急配货')" class="px-4 py-1.5 rounded-full border border-brand-sage text-brand-sage text-[11px] font-medium hover:bg-brand-sage/5 transition-colors">催发货</button>
                </div>
            </div>

            <!-- 订单 3：已完成 (体验拿样包) -->
            <div class="bg-white rounded-xl p-4 shadow-sm border border-transparent" data-status="completed">
                <div class="flex justify-between items-center pb-2.5 border-b border-gray-50 mb-3 text-xs">
                    <span class="text-gray-400">订单号: WAX20260515231</span>
                    <span class="text-gray-400">已完成</span>
                </div>
                
                <div class="flex gap-3 mb-3">
                    <div class="w-16 h-16 bg-brand-stone rounded flex-shrink-0 flex items-center justify-center border border-gray-100">
                        <span class="text-[8px] text-brand-sage/50">[样品包]</span>
                    </div>
                    <div class="flex-1 flex flex-col justify-between py-0.5">
                        <h4 class="text-xs font-bold line-clamp-1">商业渠道体验拿样包 (3款)</h4>
                        <p class="text-[10px] text-gray-400">经典系列随机搭配</p>
                        <div class="flex justify-between items-center mt-1">
                            <span class="text-xs font-serif font-bold">¥199.00</span>
                            <span class="text-[10px] text-gray-400">x 1</span>
                        </div>
                    </div>
                </div>

                <div class="flex justify-between items-center pt-2.5 border-t border-gray-50 text-xs">
                    <span class="text-gray-400">共 1 件商品</span>
                    <div>
                        合计: <span class="text-brand-berry font-bold font-serif text-sm">¥199.00</span>
                    </div>
                </div>

                <div class="flex justify-end space-x-2 mt-4 pt-1">
                    <button onclick="goPage('客服售后.html')" class="px-4 py-1.5 rounded-full border border-gray-200 text-gray-500 text-[11px] hover:bg-gray-50 transition-colors">申请售后</button>
                    <button onclick="showToast('感谢评价，积分已发放')" class="px-4 py-1.5 rounded-full bg-brand-stone text-brand-text text-[11px] font-medium hover:bg-gray-100 transition-colors">评价</button>
                </div>
            </div>

        </main>

        <div id="toast" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white text-xs px-6 py-3 rounded-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 text-center"></div>

    </div>

    <script>
        lucide.createIcons();
        
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }

        // 简易 Tab 切换筛选逻辑
        function switchOrderTab(element, status) {
            // 重置所有 tab 样式
            const tabs = element.parentElement.querySelectorAll('span');
            tabs.forEach(tab => {
                tab.className = "text-gray-400 pb-1 cursor-pointer";
            });
            // 激活当前 tab
            element.className = "font-bold text-brand-sage border-b-2 border-brand-sage pb-1 cursor-pointer";

            // 过滤订单卡片
            const cards = document.querySelectorAll('main > div');
            cards.forEach(card => {
                if (status === 'all' || card.getAttribute('data-status') === status) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        const initialStatus = window.location.hash.replace('#', '');
        if (initialStatus) {
            const targetTab = document.querySelector(`[onclick*="'${initialStatus}'"]`);
            if (targetTab) switchOrderTab(targetTab, initialStatus);
        }
    </script>
    <script src="assets/prototype-state.js"></script>
</body>
</html>
