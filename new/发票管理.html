<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>发票管理 - Wax Atelier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            stone: '#F7F6F2', ivory: '#FFFFF0', sage: '#8FA396',
                            apricot: '#F3E5D8', berry: '#8A2B46', text: '#333333', muted: '#888888'
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif SC"', 'serif'],
                        sans: ['system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #e5e7eb; }
        .app-container { background-color: #F7F6F2; }
        
        .custom-radio {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 1px solid #ccc;
            border-radius: 50%;
            display: inline-block;
            position: relative;
            outline: none;
        }
        .custom-radio:checked {
            background-color: #8FA396;
            border-color: #8FA396;
        }
        .custom-radio:checked::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            background-color: white;
            border-radius: 50%;
        }
    </style>
</head>
<body class="flex justify-center h-screen overflow-hidden text-brand-text">

    <div class="w-full h-full sm:w-[375px] sm:h-[812px] sm:my-auto sm:rounded-[40px] sm:border-[8px] border-gray-800 app-container flex flex-col relative overflow-hidden shadow-2xl font-sans bg-white">
        
        <!-- 顶部状态栏 (模拟) -->
        <div class="h-7 w-full flex justify-between items-center px-6 pt-2 text-xs font-medium text-gray-800 z-20 bg-white/90 backdrop-blur absolute top-0">
            <span>10:16</span>
            <div class="flex space-x-1 items-center">
                <i data-lucide="signal" class="w-3 h-3"></i>
                <i data-lucide="wifi" class="w-3 h-3"></i>
                <i data-lucide="battery-full" class="w-4 h-4"></i>
            </div>
        </div>

        <header class="pt-10 pb-2 px-4 flex justify-between items-center sticky top-0 z-10 bg-white/95 border-b border-gray-50">
            <div class="w-8 flex items-center cursor-pointer" onclick="history.back()">
                <i data-lucide="chevron-left" class="w-6 h-6 text-brand-text"></i>
            </div>
            <h1 class="text-lg font-bold font-serif">发票管理</h1>
            <div class="w-8"></div>
        </header>

        <!-- Tab 切换 -->
        <div class="bg-white flex justify-around py-3 text-xs border-b border-gray-100 z-10">
            <span id="tab-titles" class="font-bold text-brand-sage border-b-2 border-brand-sage pb-1 cursor-pointer transition-all" onclick="switchInvoiceTab('titles')">常用抬头</span>
            <span id="tab-records" class="text-gray-400 pb-1 cursor-pointer transition-all" onclick="switchInvoiceTab('records')">开票记录</span>
        </div>

        <main class="flex-1 overflow-y-auto no-scrollbar pb-24 p-4">
            
            <!-- 列表一：常用抬头区 -->
            <div id="section-titles" class="space-y-4">
                
                <!-- 企业抬头卡片 -->
                <div class="bg-white rounded-xl p-4 shadow-sm relative border border-transparent hover:border-brand-sage/20 transition-all">
                    <div class="absolute top-0 right-0 bg-brand-sage/10 text-brand-sage text-[10px] px-2 py-0.5 rounded-bl-lg font-medium">企业</div>
                    <div class="space-y-2 pr-8">
                        <div class="text-sm font-bold truncate">上海摩星美学设计有限公司</div>
                        <div class="text-xs text-gray-400 flex items-center gap-1.5">
                            <span class="bg-gray-100 px-1.5 py-0.5 rounded text-[10px] scale-95 font-medium">税号</span>
                            <span class="font-mono text-brand-text">91310115MA1H8GXX99</span>
                        </div>
                        <div class="text-xs text-gray-400 flex items-center gap-1.5">
                            <span class="bg-gray-100 px-1.5 py-0.5 rounded text-[10px] scale-95 font-medium">邮箱</span>
                            <span class="text-brand-text">finance@moxing.design</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between pt-3 border-t border-gray-50 mt-3">
                        <label class="flex items-center space-x-2 text-xs text-gray-400 cursor-pointer">
                            <input type="radio" name="default-invoice" class="custom-radio" checked>
                            <span>设为默认</span>
                        </label>
                        <div class="flex space-x-4 text-xs text-gray-400">
                            <span class="flex items-center cursor-pointer" onclick="showToast('编辑功能已开启')"><i data-lucide="edit-3" class="w-3 h-3 mr-1"></i> 编辑</span>
                        </div>
                    </div>
                </div>

                <!-- 个人抬头卡片 -->
                <div class="bg-white rounded-xl p-4 shadow-sm relative border border-transparent">
                    <div class="absolute top-0 right-0 bg-brand-apricot/20 text-brand-text text-[10px] px-2 py-0.5 rounded-bl-lg font-medium">个人</div>
                    <div class="space-y-2 pr-8">
                        <div class="text-sm font-bold">张三 (个人开发者/消费者)</div>
                        <div class="text-xs text-gray-400 flex items-center gap-1.5">
                            <span class="bg-gray-100 px-1.5 py-0.5 rounded text-[10px] scale-95 font-medium">邮箱</span>
                            <span class="text-brand-text font-mono">zhangsan_test@outlook.com</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between pt-3 border-t border-gray-50 mt-3">
                        <label class="flex items-center space-x-2 text-xs text-gray-400 cursor-pointer">
                            <input type="radio" name="default-invoice" class="custom-radio">
                            <span>设为默认</span>
                        </label>
                        <div class="flex space-x-4 text-xs text-gray-400">
                            <span class="flex items-center cursor-pointer text-red-400" onclick="showToast('已成功移除抬头')"><i data-lucide="trash-2" class="w-3 h-3 mr-1"></i> 删除</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 列表二：开票记录区 (默认隐藏) -->
            <div id="section-records" class="space-y-3 hidden">
                
                <!-- 开票记录卡片 1 -->
                <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-50">
                    <div class="flex justify-between items-center border-b border-gray-50 pb-2.5 mb-2.5 text-xs">
                        <span class="text-gray-400 font-mono">WAX20260601004</span>
                        <span class="text-brand-sage font-bold">开票成功</span>
                    </div>
                    <div class="flex justify-between text-xs mb-1">
                        <span class="text-gray-400">发票类型</span>
                        <span class="font-medium text-brand-text">增值税电子普通发票 (企业)</span>
                    </div>
                    <div class="flex justify-between text-xs mb-1">
                        <span class="text-gray-400">开票抬头</span>
                        <span class="font-medium text-brand-text">上海摩星美学设计有限公司</span>
                    </div>
                    <div class="flex justify-between text-xs mb-3">
                        <span class="text-gray-400">申请时间</span>
                        <span class="text-gray-400 font-mono">2026-06-02 14:15</span>
                    </div>
                    <div class="flex justify-between items-center pt-2.5 border-t border-gray-50 text-xs">
                        <span class="text-brand-berry font-serif font-bold text-sm">¥658.00</span>
                        <button onclick="showToast('发票PDF文件下载链接已复制')" class="flex items-center gap-1.5 border border-brand-sage text-brand-sage px-3 py-1 rounded-full text-[10px] font-medium hover:bg-brand-sage/5 transition-colors">
                            <i data-lucide="download" class="w-3 h-3"></i> 查看发票
                        </button>
                    </div>
                </div>

                <!-- 开票记录卡片 2 -->
                <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-50 opacity-80">
                    <div class="flex justify-between items-center border-b border-gray-50 pb-2.5 mb-2.5 text-xs">
                        <span class="text-gray-400 font-mono">WAX20260515231</span>
                        <span class="text-gray-400 font-medium">已作废</span>
                    </div>
                    <div class="flex justify-between text-xs mb-1">
                        <span class="text-gray-400">发票类型</span>
                        <span class="font-medium text-brand-text">电子普通发票 (个人)</span>
                    </div>
                    <div class="flex justify-between text-xs mb-3">
                        <span class="text-gray-400">开票金额</span>
                        <span class="text-brand-text font-serif font-bold">¥199.00</span>
                    </div>
                    <div class="text-right text-[10px] text-gray-400 italic">因发生售后退款作废</div>
                </div>
            </div>

        </main>

        <!-- 底部添加按钮 -->
        <div id="footer-btn" class="absolute bottom-0 w-full bg-white px-4 py-4 border-t border-gray-100 pb-safe z-30">
            <button onclick="toggleFormModal(true)" class="w-full bg-brand-text text-white py-3.5 rounded-full font-medium text-sm flex justify-center items-center gap-1 hover:bg-black transition-colors">
                <i data-lucide="plus" class="w-4 h-4"></i> 新增发票抬头
            </button>
        </div>

        <!-- 新增抬头弹窗表单 (自下而上滑入) -->
        <div id="form-modal" class="absolute inset-0 bg-black/40 z-50 hidden flex-col justify-end transition-opacity duration-300 opacity-0">
            <div id="form-content" class="bg-white rounded-t-2xl w-full p-4 transform translate-y-full transition-transform duration-300">
                <div class="flex justify-between items-center mb-4 border-b border-gray-50 pb-3">
                    <h3 class="font-bold font-serif text-base">新增发票抬头</h3>
                    <i data-lucide="x" class="w-5 h-5 text-gray-400 cursor-pointer" onclick="toggleFormModal(false)"></i>
                </div>
                
                <form class="space-y-3 pb-6 text-xs" onsubmit="handleFormSubmit(event)">
                    <!-- 抬头类型单选 -->
                    <div class="space-y-1.5">
                        <label class="text-gray-400 font-medium block">抬头类型</label>
                        <div class="flex gap-4">
                            <label class="flex items-center gap-1.5 cursor-pointer">
                                <input type="radio" name="form-type" value="enterprise" class="custom-radio" checked onclick="switchFormInputs('enterprise')">
                                <span>企业单位</span>
                            </label>
                            <label class="flex items-center gap-1.5 cursor-pointer">
                                <input type="radio" name="form-type" value="personal" class="custom-radio" onclick="switchFormInputs('personal')">
                                <span>个人/非企业</span>
                            </label>
                        </div>
                    </div>

                    <!-- 抬头名称 -->
                    <div class="space-y-1.5">
                        <label class="text-gray-400 font-medium block">抬头名称 <span class="text-brand-berry">*</span></label>
                        <input id="input-name" required type="text" placeholder="如：XX有限公司 或 姓名" class="w-full bg-brand-stone border-transparent rounded-lg px-3 py-2.5 text-brand-text border focus:border-brand-sage transition-colors focus:outline-none">
                    </div>

                    <!-- 企业税号 (默认展示) -->
                    <div id="form-tax-wrapper" class="space-y-1.5">
                        <label class="text-gray-400 font-medium block">纳税人识别号 <span class="text-brand-berry">*</span></label>
                        <input id="input-tax" required type="text" placeholder="15-20位企业统一社会信用代码" class="w-full bg-brand-stone border-transparent rounded-lg px-3 py-2.5 text-brand-text border focus:border-brand-sage font-mono transition-colors focus:outline-none">
                    </div>

                    <!-- 接收发票邮箱 -->
                    <div class="space-y-1.5">
                        <label class="text-gray-400 font-medium block">电子邮箱 <span class="text-brand-berry">*</span></label>
                        <input id="input-email" required type="email" placeholder="用于接收电子发票PDF" class="w-full bg-brand-stone border-transparent rounded-lg px-3 py-2.5 text-brand-text border focus:border-brand-sage font-mono transition-colors focus:outline-none">
                    </div>

                    <div class="pt-4 flex gap-3">
                        <button type="button" onclick="toggleFormModal(false)" class="flex-1 py-3 border border-gray-200 rounded-full font-medium text-gray-500 hover:bg-gray-50 transition-colors">取消</button>
                        <button type="submit" class="flex-1 py-3 bg-brand-text text-white rounded-full font-medium hover:bg-black transition-colors">保存抬头</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="toast" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white text-xs px-6 py-3 rounded-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 text-center"></div>

    </div>

    <script>
        lucide.createIcons();

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }

        // 切换常用抬头与开票记录
        function switchInvoiceTab(tab) {
            const titleTab = document.getElementById('tab-titles');
            const recordTab = document.getElementById('tab-records');
            const sectionTitles = document.getElementById('section-titles');
            const sectionRecords = document.getElementById('section-records');
            const footerBtn = document.getElementById('footer-btn');

            if (tab === 'titles') {
                titleTab.className = "font-bold text-brand-sage border-b-2 border-brand-sage pb-1 cursor-pointer transition-all";
                recordTab.className = "text-gray-400 pb-1 cursor-pointer transition-all";
                sectionTitles.classList.remove('hidden');
                sectionRecords.classList.add('hidden');
                footerBtn.classList.remove('hidden');
            } else {
                recordTab.className = "font-bold text-brand-sage border-b-2 border-brand-sage pb-1 cursor-pointer transition-all";
                titleTab.className = "text-gray-400 pb-1 cursor-pointer transition-all";
                sectionTitles.classList.add('hidden');
                sectionRecords.classList.remove('hidden');
                footerBtn.classList.add('hidden');
            }
        }

        // 控制弹窗显示
        const modal = document.getElementById('form-modal');
        const content = document.getElementById('form-content');
        function toggleFormModal(show) {
            if (show) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                void modal.offsetWidth; // 触发回流以开启动画
                modal.classList.add('opacity-100');
                content.classList.remove('translate-y-full');
            } else {
                content.classList.add('translate-y-full');
                modal.classList.remove('opacity-100');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }, 300);
            }
        }

        // 根据抬头类型动态调整必填项
        function switchFormInputs(type) {
            const taxWrapper = document.getElementById('form-tax-wrapper');
            const taxInput = document.getElementById('input-tax');
            if (type === 'personal') {
                taxWrapper.classList.add('hidden');
                taxInput.removeAttribute('required');
            } else {
                taxWrapper.classList.remove('hidden');
                taxInput.setAttribute('required', 'required');
            }
        }

        // 提交表单演示
        function handleFormSubmit(event) {
            event.preventDefault();
            toggleFormModal(false);
            showToast('发票抬头已保存成功');
            // 清空表单输入
            document.getElementById('input-name').value = '';
            document.getElementById('input-tax').value = '';
            document.getElementById('input-email').value = '';
        }
    </script>
</body>
</html>
