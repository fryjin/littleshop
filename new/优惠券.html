<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>优惠券 - Wax Atelier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { stone: '#F7F6F2', sage: '#8FA396', berry: '#8A2B46', text: '#333333', muted: '#888888' } }, fontFamily: { serif: ['"Noto Serif SC"', 'serif'], sans: ['system-ui', '-apple-system', 'sans-serif'] } } } };
    </script>
    <style>.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}body{background:#e5e7eb}.app-container{background:#F7F6F2}</style>
</head>
<body class="flex justify-center h-screen overflow-hidden text-brand-text">
    <div class="w-full h-full sm:w-[375px] sm:h-[812px] sm:my-auto sm:rounded-[40px] sm:border-[8px] border-gray-800 app-container flex flex-col relative overflow-hidden shadow-2xl font-sans">
        <div class="h-7 w-full flex justify-between items-center px-6 pt-2 text-xs font-medium text-gray-800 z-20 bg-brand-stone absolute top-0"><span>10:16</span><div class="flex space-x-1 items-center"><i data-lucide="signal" class="w-3 h-3"></i><i data-lucide="wifi" class="w-3 h-3"></i><i data-lucide="battery-full" class="w-4 h-4"></i></div></div>
        <header class="pt-10 pb-2 px-4 flex justify-between items-center sticky top-0 z-10 bg-brand-stone border-b border-gray-200/50">
            <div class="w-8 flex items-center cursor-pointer" onclick="goBack('我的.html')"><i data-lucide="chevron-left" class="w-6 h-6"></i></div>
            <h1 class="text-lg font-bold font-serif">优惠券</h1>
            <div class="w-8"></div>
        </header>
        <main class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-3 pb-10">
            <article class="bg-white rounded-xl overflow-hidden shadow-sm flex">
                <div class="w-24 bg-brand-sage text-white flex flex-col items-center justify-center">
                    <b class="text-2xl font-serif">¥80</b><span class="text-xs">礼盒券</span>
                </div>
                <div class="flex-1 p-4">
                    <h2 class="font-bold text-sm">节日礼盒复购券</h2>
                    <p class="text-xs text-gray-500 mt-1">满 ¥528 可用，适合礼盒组合。</p>
                    <span class="inline-block mt-3 text-[10px] bg-brand-stone px-2 py-1 rounded-full">7 天后到期</span>
                </div>
            </article>
            <article class="bg-white rounded-xl overflow-hidden shadow-sm flex">
                <div class="w-24 bg-brand-stone text-brand-text flex flex-col items-center justify-center">
                    <b class="text-2xl font-serif">¥30</b><span class="text-xs">会员券</span>
                </div>
                <div class="flex-1 p-4">
                    <h2 class="font-bold text-sm">会员积分兑换券</h2>
                    <p class="text-xs text-gray-500 mt-1">适合中号单品或礼盒升级。</p>
                    <span class="inline-block mt-3 text-[10px] bg-brand-stone px-2 py-1 rounded-full">长期有效</span>
                </div>
            </article>
        </main>
    </div>
    <script>lucide.createIcons();</script>
    <script src="assets/prototype-state.js"></script>
</body>
</html>
