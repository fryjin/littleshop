<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>收藏与浏览 - Wax Atelier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { stone: '#F7F6F2', sage: '#8FA396', berry: '#8A2B46', text: '#333333', muted: '#888888' } }, fontFamily: { serif: ['"Noto Serif SC"', 'serif'], sans: ['system-ui', '-apple-system', 'sans-serif'] } } } };
    </script>
    <style>.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}body{background:#e5e7eb}.app-container{background:#F7F6F2}</style>
</head>
<body class="flex justify-center h-screen overflow-hidden text-brand-text">
    <div class="w-full h-full sm:w-[375px] sm:h-[812px] sm:my-auto sm:rounded-[40px] sm:border-[8px] border-gray-800 app-container flex flex-col relative overflow-hidden shadow-2xl font-sans">
        <div class="h-7 w-full flex justify-between items-center px-6 pt-2 text-xs font-medium text-gray-800 z-20 bg-brand-stone absolute top-0"><span>10:16</span><div class="flex space-x-1 items-center"><i data-lucide="signal" class="w-3 h-3"></i><i data-lucide="wifi" class="w-3 h-3"></i><i data-lucide="battery-full" class="w-4 h-4"></i></div></div>
        <header class="pt-10 pb-2 px-4 flex justify-between items-center sticky top-0 z-10 bg-brand-stone border-b border-gray-200/50">
            <div class="w-8 flex items-center cursor-pointer" onclick="goBack('我的.html')"><i data-lucide="chevron-left" class="w-6 h-6"></i></div>
            <h1 class="text-lg font-bold font-serif">收藏与浏览</h1>
            <div class="w-8"></div>
        </header>
        <main class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-4 pb-10">
            <section class="bg-white rounded-xl p-4 shadow-sm">
                <h2 class="font-bold text-sm mb-3">我的收藏</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div class="cursor-pointer" onclick="goPage('商品详情页.html?series=advanced')"><div class="aspect-square rounded-xl bg-[#F3E5D8] mb-2"></div><b class="text-xs">勃艮第红复古卷边</b><p class="text-xs text-brand-berry font-serif">¥259</p></div>
                    <div class="cursor-pointer" onclick="goPage('商品详情页.html?series=artisan')"><div class="aspect-square rounded-xl bg-[#E8EAE6] mb-2"></div><b class="text-xs">雾蓝花冠</b><p class="text-xs text-brand-berry font-serif">¥429</p></div>
                </div>
            </section>
            <section class="bg-white rounded-xl p-4 shadow-sm">
                <h2 class="font-bold text-sm mb-3">最近浏览</h2>
                <div class="space-y-3">
                    <div class="flex items-center gap-3 cursor-pointer" onclick="goPage('商品详情页.html?series=festival')"><div class="w-14 h-14 rounded-lg bg-brand-stone"></div><div><b class="text-xs">红白限定节日蜡烛</b><p class="text-xs text-gray-500">今天 10:12</p></div></div>
                    <div class="flex items-center gap-3 cursor-pointer" onclick="goPage('商品详情页.html?series=advanced')"><div class="w-14 h-14 rounded-lg bg-[#F3E5D8]"></div><div><b class="text-xs">冬日暖阳双支礼盒</b><p class="text-xs text-gray-500">昨天 18:30</p></div></div>
                </div>
            </section>
        </main>
    </div>
    <script>lucide.createIcons();</script>
    <script src="assets/prototype-state.js"></script>
</body>
</html>
