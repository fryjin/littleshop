<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>会员积分 - Wax Atelier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            stone: '#F7F6F2', sage: '#8FA396', berry: '#8A2B46', text: '#333333', muted: '#888888'
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif SC"', 'serif'],
                        sans: ['system-ui', '-apple-system', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #e5e7eb; }
        .app-container { background-color: #F7F6F2; }
    </style>
</head>
<body class="flex justify-center h-screen overflow-hidden text-brand-text">
    <div class="w-full h-full sm:w-[375px] sm:h-[812px] sm:my-auto sm:rounded-[40px] sm:border-[8px] border-gray-800 app-container flex flex-col relative overflow-hidden shadow-2xl font-sans">
        <div class="h-7 w-full flex justify-between items-center px-6 pt-2 text-xs font-medium text-gray-800 z-20 bg-brand-stone absolute top-0">
            <span>10:16</span>
            <div class="flex space-x-1 items-center"><i data-lucide="signal" class="w-3 h-3"></i><i data-lucide="wifi" class="w-3 h-3"></i><i data-lucide="battery-full" class="w-4 h-4"></i></div>
        </div>
        <header class="pt-10 pb-2 px-4 flex justify-between items-center sticky top-0 z-10 bg-brand-stone border-b border-gray-200/50">
            <div class="w-8 flex items-center cursor-pointer" onclick="goBack('我的.html')"><i data-lucide="chevron-left" class="w-6 h-6"></i></div>
            <h1 class="text-lg font-bold font-serif">会员积分</h1>
            <div class="w-8"></div>
        </header>
        <main class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-4 pb-10">
            <section class="bg-white rounded-xl p-5 shadow-sm">
                <p class="text-xs text-brand-muted mb-2">可用积分</p>
                <div class="text-3xl font-bold font-serif text-brand-text">1280</div>
                <p class="text-xs text-gray-500 mt-2">下单、评价和复购都会累计积分。</p>
            </section>
            <section class="bg-white rounded-xl p-4 shadow-sm">
                <h2 class="font-bold text-sm mb-3">积分商城</h2>
                <div class="grid grid-cols-2 gap-3">
                    <button class="rounded-xl border border-gray-100 p-3 text-left" onclick="showToast('已加入兑换清单')">
                        <b class="block text-sm">生日贺卡券</b>
                        <span class="text-xs text-gray-500">300 积分</span>
                    </button>
                    <button class="rounded-xl border border-gray-100 p-3 text-left" onclick="showToast('已加入兑换清单')">
                        <b class="block text-sm">礼盒升级券</b>
                        <span class="text-xs text-gray-500">680 积分</span>
                    </button>
                </div>
            </section>
            <section class="bg-white rounded-xl p-4 shadow-sm">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="font-bold text-sm">积分明细</h2>
                    <span class="text-xs text-brand-sage">全部明细</span>
                </div>
                <div class="space-y-3 text-sm">
                    <div class="flex justify-between gap-3"><span>完成订单 WAX20260515231</span><b class="text-brand-sage">+120</b></div>
                    <div class="flex justify-between gap-3"><span>评价商品</span><b class="text-brand-sage">+30</b></div>
                    <div class="flex justify-between gap-3"><span>复购礼盒积分</span><b class="text-brand-sage">+80</b></div>
                    <div class="flex justify-between gap-3"><span>兑换生日贺卡券</span><b class="text-brand-berry">-300</b></div>
                    <div class="flex justify-between gap-3"><span>兑换礼盒升级券</span><b class="text-brand-berry">-680</b></div>
                    <div class="flex justify-between gap-3"><span>完成订单 WAX20260422019</span><b class="text-brand-sage">+160</b></div>
                </div>
            </section>
        </main>
        <div id="toast" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white text-sm px-6 py-3 rounded-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50"></div>
    </div>
    <script>
        lucide.createIcons();
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('opacity-0');
            setTimeout(function () { toast.classList.add('opacity-0'); }, 1800);
        }
    </script>
    <script src="assets/prototype-state.js"></script>
</body>
</html>
