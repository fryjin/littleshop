<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>商品详情 - Wax Atelier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            stone: '#F7F6F2', ivory: '#FFFFF0', sage: '#8FA396',
                            apricot: '#F3E5D8', berry: '#8A2B46', text: '#333333', muted: '#888888'
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif SC"', 'serif'],
                        sans: ['system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #e5e7eb; }
        .app-container { background-color: #FFFFFF; }
        
        .spec-btn.active { border-color: #8FA396; color: #8FA396; background-color: rgba(143, 163, 150, 0.05); }
        .option-tile.active { border-color: #8FA396; color: #333333; background-color: rgba(143, 163, 150, 0.08); }
    </style>
</head>
<body class="flex justify-center h-screen overflow-hidden text-brand-text">

    <div class="w-full h-full sm:w-[375px] sm:h-[812px] sm:my-auto sm:rounded-[40px] sm:border-[8px] border-gray-800 app-container flex flex-col relative overflow-hidden shadow-2xl font-sans">
        
        <!-- 返回按钮 (悬浮) -->
        <div class="absolute top-10 left-4 z-30 w-8 h-8 bg-black/30 backdrop-blur rounded-full flex items-center justify-center cursor-pointer" onclick="goBack('商品分类.html')">
            <i data-lucide="chevron-left" class="w-5 h-5 text-white"></i>
        </div>

        <main class="flex-1 overflow-y-auto no-scrollbar pb-32">
            
            <!-- 轮播图区域 -->
            <div class="w-full h-[375px] bg-[#EBE7DF] relative flex items-center justify-center">
                <span class="text-brand-sage/50 text-sm">[商品主图/轮播 1/4]</span>
                <!-- 轮播指示器 -->
                <div class="absolute bottom-4 flex space-x-1.5">
                    <div class="w-4 h-1.5 bg-brand-sage rounded-full"></div>
                    <div class="w-1.5 h-1.5 bg-white/50 rounded-full"></div>
                    <div class="w-1.5 h-1.5 bg-white/50 rounded-full"></div>
                    <div class="w-1.5 h-1.5 bg-white/50 rounded-full"></div>
                </div>
            </div>

            <!-- 商品基础信息 -->
            <div class="px-4 py-5 border-b border-gray-100">
                <div class="flex justify-between items-start mb-2">
                    <h1 class="text-xl font-serif font-bold leading-tight">勃艮第红复古卷边蜡烛<br><span class="text-sm font-normal text-brand-muted mt-1 inline-block">Burgundy Ruffle Candle</span></h1>
                    <div class="flex flex-col items-end">
                        <span class="text-xl font-bold font-serif text-brand-berry">¥259.00</span>
                    </div>
                </div>
                <p class="text-xs text-brand-muted line-clamp-2">进阶系列手工雕刻蜡烛，独特的波浪卷边设计，搭配柔和花木香气，为空间注入温暖与质感。</p>
            </div>

            <!-- 阶梯价提示 -->
            <div class="px-4 py-3 bg-[#F3E5D8]/30 flex items-center justify-between">
                <span class="text-xs font-medium text-brand-text">批发阶梯价</span>
                <!--  将此处 onClick 事件修改为跳转到批发合作说明页 -->
                <span class="text-xs text-brand-sage cursor-pointer" onclick="window.location.href='渠道合作申请.html'">申请后查看 <i data-lucide="chevron-right" class="w-3 h-3 inline"></i></span>
            </div>

            <!-- 规格选择区 -->
            <div class="p-4 space-y-5">
                
                <!-- 尺寸 -->
                <div>
                    <h3 class="text-sm font-medium mb-3">规格尺寸</h3>
                    <div class="grid grid-cols-4 gap-2" id="size-options">
                        <button class="size-btn option-tile active rounded-lg border border-gray-200 py-2 text-center text-xs transition-colors" data-size="S" onclick="selectSize('S')">
                            <span class="block font-bold text-sm">S</span>
                            <span class="block text-[10px] text-gray-400 mt-1">6x8cm</span>
                        </button>
                        <button class="size-btn option-tile rounded-lg border border-gray-200 py-2 text-center text-xs transition-colors" data-size="M" onclick="selectSize('M')">
                            <span class="block font-bold text-sm">M</span>
                            <span class="block text-[10px] text-gray-400 mt-1">7x10cm</span>
                        </button>
                        <button class="size-btn option-tile rounded-lg border border-gray-200 py-2 text-center text-xs transition-colors" data-size="L" onclick="selectSize('L')">
                            <span class="block font-bold text-sm">L</span>
                            <span class="block text-[10px] text-gray-400 mt-1">8x12cm</span>
                        </button>
                        <button class="size-btn option-tile rounded-lg border border-gray-200 py-2 text-center text-xs transition-colors" data-size="XL" onclick="selectSize('XL')">
                            <span class="block font-bold text-sm">XL</span>
                            <span class="block text-[10px] text-gray-400 mt-1">10x15cm</span>
                        </button>
                    </div>
                </div>

                <!-- 雕花预览 -->
                <div>
                    <div class="flex justify-between items-end mb-3">
                        <h3 class="text-sm font-medium">雕花款式</h3>
                        <span class="text-[10px] text-brand-muted" id="carving-summary">默认 S 尺寸</span>
                    </div>
                    <div class="grid grid-cols-3 gap-2" id="carving-options"></div>
                </div>

                <!-- 香型选择 -->
                <div>
                    <div class="flex justify-between items-end mb-3">
                        <h3 class="text-sm font-medium">香型选择</h3>
                        <span class="text-[10px] text-brand-muted" id="scent-series-label">进阶系列 · 法国品牌</span>
                    </div>
                    <div id="scent-brand-options" class="hidden flex gap-2 mb-3">
                        <button class="scent-brand-btn spec-btn active px-3 py-1.5 text-xs border border-gray-200 rounded-full text-gray-600 transition-colors" onclick="selectScentBrand('france')">法国品牌</button>
                        <button class="scent-brand-btn spec-btn px-3 py-1.5 text-xs border border-gray-200 rounded-full text-gray-600 transition-colors" onclick="selectScentBrand('usa')">美国品牌</button>
                    </div>
                    <div class="flex flex-wrap gap-2" id="scent-options"></div>
                </div>

            </div>
            
            <!-- 用户评价 -->
            <section class="px-4 pt-2 pb-4">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-sm font-medium">用户评价</h3>
                    <button onclick="goPage('评价列表.html#reviewed')" class="text-[11px] text-brand-sage flex items-center gap-0.5">
                        查看全部 <i data-lucide="chevron-right" class="w-3 h-3"></i>
                    </button>
                </div>
                <article class="bg-brand-stone/70 rounded-xl p-3 flex gap-3 cursor-pointer" onclick="goPage('评价详情.html')">
                    <div class="w-16 h-16 rounded-lg bg-[#F3E5D8] flex-shrink-0 flex items-center justify-center text-[10px] text-brand-sage">评价图</div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between gap-2">
                            <div class="flex items-center gap-2">
                                <span class="w-6 h-6 rounded-full bg-white flex items-center justify-center text-[11px] font-bold text-brand-sage">W</span>
                                <span class="text-xs font-medium">周女士</span>
                            </div>
                            <span class="text-[10px] text-gray-400">最新带图</span>
                        </div>
                        <p class="text-xs text-gray-600 leading-relaxed mt-2 line-clamp-2">包装很稳，卷边细节比图片里更立体。玫瑰木香味偏柔，放客厅不冲。</p>
                        <div class="mt-2 text-[10px] text-gray-400">M · 玫瑰木 · 水波纹</div>
                    </div>
                </article>
            </section>

            <!-- 占位图文详情 -->
            <div class="mt-4 pb-10">
                <div class="flex items-center justify-center py-4 border-t border-gray-100">
                    <div class="h-[1px] w-12 bg-gray-200"></div>
                    <span class="text-xs text-brand-muted mx-4 font-serif">图文详情</span>
                    <div class="h-[1px] w-12 bg-gray-200"></div>
                </div>
                <div class="w-full h-64 bg-gray-50 flex items-center justify-center">
                    <span class="text-gray-400 text-sm">详情长图区域</span>
                </div>
            </div>
        </main>

        <!-- 底部购买区 & 导航 -->
        <div class="absolute bottom-[68px] w-full bg-white px-4 py-3 border-t border-gray-100 shadow-[0_-4px_15px_rgba(0,0,0,0.02)] z-30">
            <div class="flex items-center justify-between">
                <div class="flex space-x-4 mr-4">
                    <div class="flex flex-col items-center justify-center text-gray-500 cursor-pointer" onclick="goPage('客服售后.html')">
                        <i data-lucide="headphones" class="w-5 h-5 mb-0.5"></i>
                        <span class="text-[9px]">客服</span>
                    </div>
                </div>
                <div class="flex-1 flex space-x-2">
                    <button onclick="addPrototypeCart(event, '勃艮第红复古卷边蜡烛', '¥259.00')" class="flex-1 py-2.5 rounded-full border border-brand-sage text-brand-sage text-sm font-medium">加入购物车</button>
                    <button onclick="addPrototypeCartAndCheckout(event, '勃艮第红复古卷边蜡烛', '¥259.00')" class="flex-1 py-2.5 rounded-full bg-brand-text text-white text-sm font-medium">立即购买</button>
                </div>
            </div>
        </div>

        <!-- 底部全局导航栏 -->
        <nav class="absolute bottom-0 w-full bg-white/90 backdrop-blur-md border-t border-gray-100 pb-safe pt-2 px-2 z-30 flex justify-around items-center h-[68px]">
            <div class="flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-brand-text cursor-pointer transition-colors" onclick="goPage('商城首页.html')">
                <i data-lucide="home" class="w-[22px] h-[22px] mb-1"></i>
                <span class="text-[10px] font-medium">首页</span>
            </div>
            <div class="flex flex-col items-center justify-center w-full h-full text-brand-text cursor-pointer">
                <i data-lucide="layout-grid" class="w-[22px] h-[22px] mb-1 text-brand-sage fill-brand-sage/20"></i>
                <span class="text-[10px] font-bold text-brand-sage">分类</span>
            </div>
            <div class="flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-brand-text cursor-pointer relative transition-colors" onclick="goPage('购物车.html')">
                <i data-lucide="shopping-bag" class="w-[22px] h-[22px] mb-1"></i>
                <span class="text-[10px] font-medium">购物车</span>
                <span class="absolute top-[2px] right-4 bg-brand-berry text-white text-[9px] px-[5px] py-[1px] rounded-full font-bold shadow-sm">1</span>
            </div>
            <div class="flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-brand-text cursor-pointer transition-colors" onclick="goPage('我的.html')">
                <i data-lucide="user" class="w-[22px] h-[22px] mb-1"></i>
                <span class="text-[10px] font-medium">我的</span>
            </div>
        </nav>

        <!-- 雕花大图预览弹窗 -->
        <div id="image-modal" class="absolute inset-0 bg-black/90 z-50 hidden flex-col items-center justify-center transition-opacity duration-300 opacity-0" onclick="toggleImageModal(false)">
            <i data-lucide="x" class="absolute top-10 right-6 w-6 h-6 text-white cursor-pointer z-50"></i>
            <div class="w-full aspect-square bg-[#E8EAE6] flex items-center justify-center m-4" onclick="event.stopPropagation()">
                 <span class="text-brand-sage/60 font-medium">雕花细节大图 (水波纹)</span>
            </div>
            <p class="text-white mt-4 font-medium">水波纹雕花工艺演示</p>
        </div>

        <div id="toast" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white text-sm px-6 py-3 rounded-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50">
            提示信息
        </div>

    </div>

    <script>
        lucide.createIcons();

        const carvingBySize = {
            S: ['S 水波纹', 'S 叶脉纹', 'S 卷边花冠'],
            M: ['M 水波纹', 'M 叶脉纹', 'M 花瓣层叠'],
            L: ['L 宫廷褶皱', 'L 花冠卷边', 'L 层叠叶纹'],
            XL: ['XL 宫廷褶皱', 'XL 陈列花冠', 'XL 大型卷边']
        };
        const scentData = {
            france: [
                '玫瑰木',
                '白茶',
                '无香陈列'
            ],
            usa: [
                '玫瑰木',
                '白花麝香',
                '晚香玉',
                '雪松琥珀',
                '檀木',
                '乌木烟熏',
                '莓果',
                '柑橘橙花',
                '白茶',
                '无香陈列'
            ]
        };
        const params = new URLSearchParams(window.location.search);
        const productSeries = params.get('series') || 'advanced';
        let currentSize = 'S';
        let currentScentBrand = productSeries === 'artisan' ? 'usa' : 'france';

        function selectSize(size) {
            currentSize = size;
            document.querySelectorAll('.size-btn').forEach(function (btn) {
                btn.classList.toggle('active', btn.dataset.size === size);
            });
            renderCarvingOptions();
        }

        function renderCarvingOptions() {
            const options = carvingBySize[currentSize] || carvingBySize.S;
            document.getElementById('carving-summary').textContent = '当前 ' + currentSize + ' 尺寸';
            document.getElementById('carving-options').innerHTML = options.map(function (name, index) {
                return [
                    '<button class="carving-btn option-tile ' + (index === 0 ? 'active' : '') + ' rounded-lg border border-gray-200 p-2 text-center transition-colors" onclick="selectCarving(this, &quot;' + name + '&quot;)">',
                    '  <div class="w-full aspect-square rounded bg-[#E8EAE6] mb-1 flex items-center justify-center text-[9px] text-brand-sage/60">预览</div>',
                    '  <span class="text-[10px] font-medium">' + name + '</span>',
                    '</button>'
                ].join('');
            }).join('');
        }

        function selectCarving(button, name) {
            document.querySelectorAll('.carving-btn').forEach(function (btn) {
                btn.classList.remove('active');
            });
            button.classList.add('active');
            toggleImageModal(true, name);
        }

        function selectScentBrand(brand) {
            currentScentBrand = brand;
            document.querySelectorAll('.scent-brand-btn').forEach(function (btn) {
                btn.classList.toggle('active', btn.getAttribute('onclick') === "selectScentBrand('" + brand + "')");
            });
            renderScentOptions();
        }

        function renderScentOptions() {
            if (productSeries === 'festival') {
                document.getElementById('scent-brand-options').classList.remove('hidden');
                document.getElementById('scent-series-label').textContent = '节日系列 · 先选品牌';
            } else if (productSeries === 'artisan') {
                document.getElementById('scent-series-label').textContent = '匠作系列 · 美国品牌';
                currentScentBrand = 'usa';
            } else {
                document.getElementById('scent-series-label').textContent = '进阶系列 · 法国品牌';
                currentScentBrand = 'france';
            }

            const options = scentData[currentScentBrand];
            document.getElementById('scent-options').innerHTML = options.map(function (name, index) {
                return '<button class="scent-btn spec-btn ' + (index === 0 ? 'active' : '') + ' px-3 py-2 text-xs border border-gray-200 rounded text-gray-600 transition-colors" onclick="selectScent(this)">' + name + '</button>';
            }).join('');
        }

        function selectScent(button) {
            document.querySelectorAll('.scent-btn').forEach(function (btn) {
                btn.classList.remove('active');
            });
            button.classList.add('active');
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }

        // 雕花预览弹窗逻辑
        const modal = document.getElementById('image-modal');
        function toggleImageModal(show, title) {
            if (show) {
                if (title) {
                    modal.querySelector('span').textContent = title + ' · 雕花细节大图';
                    modal.querySelector('p').textContent = title;
                }
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                void modal.offsetWidth; // trigger reflow
                modal.classList.add('opacity-100');
            } else {
                modal.classList.remove('opacity-100');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }, 300);
            }
        }

        selectSize('S');
        renderScentOptions();
    </script>
    <script src="assets/prototype-state.js"></script>
</body>
</html>
