<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>评价详情 - Wax Atelier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            stone: '#F7F6F2', sage: '#8FA396', berry: '#8A2B46', text: '#333333'
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif SC"', 'serif'],
                        sans: ['system-ui', '-apple-system', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #e5e7eb; }
        .app-container { background-color: #F7F6F2; }
    </style>
</head>
<body class="flex justify-center h-screen overflow-hidden text-brand-text">
    <div class="w-full h-full sm:w-[375px] sm:h-[812px] sm:my-auto sm:rounded-[40px] sm:border-[8px] border-gray-800 app-container flex flex-col relative overflow-hidden shadow-2xl font-sans">
        <div class="h-7 w-full flex justify-between items-center px-6 pt-2 text-xs font-medium text-gray-800 z-20 bg-brand-stone absolute top-0">
            <span>10:16</span>
            <div class="flex space-x-1 items-center"><i data-lucide="signal" class="w-3 h-3"></i><i data-lucide="wifi" class="w-3 h-3"></i><i data-lucide="battery-full" class="w-4 h-4"></i></div>
        </div>
        <header class="pt-10 pb-2 px-4 flex justify-between items-center sticky top-0 z-10 bg-brand-stone border-b border-gray-200/50">
            <div class="w-8 flex items-center cursor-pointer" onclick="goBack('商品详情页.html')"><i data-lucide="chevron-left" class="w-6 h-6"></i></div>
            <h1 class="text-lg font-bold font-serif">评价详情</h1>
            <div class="w-8"></div>
        </header>
        <main class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-4 pb-10">
            <section class="bg-white rounded-xl p-4 shadow-sm">
                <div class="flex items-center gap-3">
                    <span class="w-10 h-10 rounded-full bg-brand-stone flex items-center justify-center text-brand-sage font-bold">W</span>
                    <div>
                        <h2 class="text-sm font-bold">周女士</h2>
                        <p class="text-xs text-gray-400">2026-06-02 · 最新带图评价</p>
                    </div>
                </div>
                <p class="text-sm text-gray-700 leading-relaxed mt-4">包装很稳，卷边细节比图片里更立体。玫瑰木香味偏柔，放客厅不冲，送朋友也比较体面。</p>
                <div class="grid grid-cols-3 gap-2 mt-4">
                    <div class="aspect-square rounded-lg bg-[#F3E5D8] flex items-center justify-center text-[10px] text-brand-sage">图片 1</div>
                    <div class="aspect-square rounded-lg bg-[#E8EAE6] flex items-center justify-center text-[10px] text-brand-sage">图片 2</div>
                    <div class="aspect-square rounded-lg bg-brand-stone flex items-center justify-center text-[10px] text-brand-sage">图片 3</div>
                </div>
                <div class="mt-4 rounded-xl bg-brand-stone/70 p-3 text-xs text-gray-500">
                    购买规格：M · 玫瑰木 · 水波纹 · 精品包装
                </div>
            </section>
            <section class="bg-white rounded-xl p-4 shadow-sm">
                <h3 class="text-sm font-bold mb-2">商家回复</h3>
                <p class="text-xs text-gray-600 leading-relaxed">感谢反馈。雕花边缘属于手工处理，每支细节会略有不同，后续使用请注意避光和防尘。</p>
            </section>
        </main>
    </div>
    <script>
        lucide.createIcons();
    </script>
    <script src="assets/prototype-state.js"></script>
</body>
</html>
