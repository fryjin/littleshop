<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>付款 - Wax Atelier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            stone: '#F7F6F2', ivory: '#FFFFF0', sage: '#8FA396',
                            apricot: '#F3E5D8', berry: '#8A2B46', text: '#333333', muted: '#888888'
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif SC"', 'serif'],
                        sans: ['system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #e5e7eb; }
        .app-container { background-color: #F7F6F2; }
    </style>
</head>
<body class="flex justify-center h-screen overflow-hidden text-brand-text">
    <div class="w-full h-full sm:w-[375px] sm:h-[812px] sm:my-auto sm:rounded-[40px] sm:border-[8px] border-gray-800 app-container flex flex-col relative overflow-hidden shadow-2xl font-sans">
        <div class="h-7 w-full flex justify-between items-center px-6 pt-2 text-xs font-medium text-gray-800 z-20 bg-brand-stone bg-opacity-90 absolute top-0">
            <span>10:16</span>
            <div class="flex space-x-1 items-center">
                <i data-lucide="signal" class="w-3 h-3"></i>
                <i data-lucide="wifi" class="w-3 h-3"></i>
                <i data-lucide="battery-full" class="w-4 h-4"></i>
            </div>
        </div>

        <header class="pt-10 pb-3 px-4 flex justify-between items-center sticky top-0 z-10 bg-brand-stone bg-opacity-95 border-b border-gray-200/50">
            <div class="w-8 flex items-center cursor-pointer" onclick="goBack('购物车.html')">
                <i data-lucide="chevron-left" class="w-6 h-6 text-brand-text"></i>
            </div>
            <h1 class="text-lg font-bold font-serif">付款</h1>
            <div class="w-8"></div>
        </header>

        <main class="flex-1 overflow-y-auto no-scrollbar p-4 pb-28 space-y-4">
            <section class="bg-white rounded-2xl p-5 shadow-sm">
                <p class="text-xs text-gray-500 mb-2">订单金额</p>
                <div class="flex items-end justify-between">
                    <div>
                        <div class="text-3xl font-serif font-bold text-brand-berry">¥658.00</div>
                        <p class="text-xs text-gray-500 mt-2">含 2 件商品，已选地址与配送方式。</p>
                    </div>
                    <span class="px-2.5 py-1 rounded-full bg-brand-sage/10 text-brand-sage text-xs">待付款</span>
                </div>
            </section>

            <section class="bg-white rounded-2xl overflow-hidden shadow-sm">
                <div class="p-4 border-b border-gray-50 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-full bg-brand-sage/10 flex items-center justify-center">
                            <i data-lucide="message-circle" class="w-4 h-4 text-brand-sage"></i>
                        </div>
                        <div>
                            <h3 class="text-sm font-bold">微信支付</h3>
                            <p class="text-xs text-gray-500 mt-0.5">推荐使用</p>
                        </div>
                    </div>
                    <i data-lucide="check-circle-2" class="w-5 h-5 text-brand-sage"></i>
                </div>
                <div class="p-4 flex items-center justify-between opacity-60">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-full bg-brand-stone flex items-center justify-center">
                            <i data-lucide="wallet" class="w-4 h-4 text-gray-500"></i>
                        </div>
                        <div>
                            <h3 class="text-sm font-bold">余额支付</h3>
                            <p class="text-xs text-gray-500 mt-0.5">本次暂不可用</p>
                        </div>
                    </div>
                </div>
            </section>

            <section class="bg-white rounded-2xl p-4 shadow-sm">
                <div class="flex justify-between text-sm">
                    <span class="text-gray-500">商品金额</span>
                    <span>¥658.00</span>
                </div>
                <div class="flex justify-between text-sm mt-3">
                    <span class="text-gray-500">优惠</span>
                    <span>¥0.00</span>
                </div>
                <div class="flex justify-between text-sm mt-3">
                    <span class="text-gray-500">配送</span>
                    <span>¥0.00</span>
                </div>
            </section>
        </main>

        <div class="absolute bottom-0 w-full bg-white px-4 py-4 border-t border-gray-100 z-30">
            <button onclick="goPage('支付成功.html')" class="w-full py-3.5 rounded-full bg-brand-text text-white text-sm font-bold">确认付款 ¥658.00</button>
        </div>

        <div id="toast" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white text-sm px-6 py-3 rounded-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50">提示信息</div>
    </div>
    <script>
        lucide.createIcons();
    </script>
    <script src="assets/prototype-state.js"></script>
</body>
</html>
