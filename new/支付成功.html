<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>支付成功 - Wax Atelier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            stone: '#F7F6F2', ivory: '#FFFFF0', sage: '#8FA396',
                            apricot: '#F3E5D8', berry: '#8A2B46', text: '#333333', muted: '#888888'
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif SC"', 'serif'],
                        sans: ['system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #e5e7eb; }
        .app-container { background-color: #F7F6F2; }
    </style>
</head>
<body class="flex justify-center h-screen overflow-hidden text-brand-text">

    <div class="w-full h-full sm:w-[375px] sm:h-[812px] sm:my-auto sm:rounded-[40px] sm:border-[8px] border-gray-800 app-container flex flex-col relative overflow-hidden shadow-2xl font-sans bg-white">
        
        <!-- 顶部状态栏 (模拟) -->
        <div class="h-7 w-full flex justify-between items-center px-6 pt-2 text-xs font-medium text-gray-800 z-20 bg-white/90 backdrop-blur absolute top-0">
            <span>10:16</span>
            <div class="flex space-x-1 items-center">
                <i data-lucide="signal" class="w-3 h-3"></i>
                <i data-lucide="wifi" class="w-3 h-3"></i>
                <i data-lucide="battery-full" class="w-4 h-4"></i>
            </div>
        </div>

        <!-- 头部导航 -->
        <header class="pt-10 pb-2 px-4 flex justify-between items-center sticky top-0 z-10 bg-white/95 border-b border-gray-50">
            <div class="w-8 flex items-center cursor-pointer" onclick="window.location.href='商城首页.html'">
                <i data-lucide="chevron-left" class="w-6 h-6 text-brand-text"></i>
            </div>
            <h1 class="text-lg font-bold font-serif">支付结果</h1>
            <div class="w-8"></div>
        </header>

        <main class="flex-1 overflow-y-auto no-scrollbar pb-10">
            
            <!-- 支付成功主状态区 -->
            <div class="flex flex-col items-center justify-center py-10 px-6 text-center border-b border-gray-50">
                <div class="w-16 h-16 bg-brand-sage/10 rounded-full flex items-center justify-center mb-4">
                    <i data-lucide="check" class="w-8 h-8 text-brand-sage"></i>
                </div>
                <h2 class="text-xl font-serif font-bold mb-1">支付成功</h2>
                <p class="text-xs text-brand-muted leading-relaxed">您的订单已在精细打包中，稍后可留意物流通知。</p>
                
                <!-- 支付总计 -->
                <div class="mt-6 flex items-baseline space-x-0.5">
                    <span class="text-xs text-gray-400 mr-1">实付金额</span>
                    <span class="text-brand-berry font-bold font-serif text-2xl">¥658.00</span>
                </div>
            </div>

            <!-- 配送/订单基本资料卡片 -->
            <div class="p-4">
                <div class="bg-brand-stone/50 rounded-xl p-4 space-y-3.5 border border-gray-50">
                    <div class="flex justify-between text-xs">
                        <span class="text-gray-400">收货人</span>
                        <span class="font-medium">张女士 138****8888</span>
                    </div>
                    <div class="flex justify-between text-xs">
                        <span class="text-gray-400 flex-shrink-0 mr-4">收货地址</span>
                        <span class="font-medium text-right line-clamp-1">上海市 徐汇区 衡山路某某弄某某号</span>
                    </div>
                    <div class="flex justify-between text-xs">
                        <span class="text-gray-400">配送服务</span>
                        <span class="font-medium">顺丰速运 (包邮)</span>
                    </div>
                </div>
            </div>

            <!-- 行为 CTA 组 -->
            <div class="px-4 py-4 flex space-x-3">
                <button onclick="window.location.href='订单列表.html'" class="flex-1 py-3 border border-brand-sage text-brand-sage rounded-full font-medium text-xs hover:bg-brand-sage/5 transition-colors">查看订单</button>
                <button onclick="window.location.href='商城首页.html'" class="flex-1 py-3 bg-brand-text text-white rounded-full font-medium text-xs hover:bg-black transition-colors">返回首页</button>
            </div>

            <!-- 极简加购推荐 (不破坏整体氛围) -->
            <div class="mt-6 px-4">
                <h3 class="text-xs font-bold font-serif mb-3 flex items-center text-brand-muted">
                    <div class="w-1 h-3 bg-brand-sage/40 mr-2 rounded-full"></div>
                    推荐搭配周边
                </h3>
                
                <!-- 推荐小卡片：黑胡桃木托盘 -->
                <div class="bg-brand-stone/30 rounded-xl p-3 flex justify-between items-center border border-gray-100">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 bg-white rounded border border-gray-100 flex items-center justify-center text-[8px] text-gray-300">
                            [托盘]
                        </div>
                        <div>
                            <span class="text-xs font-bold block">黑胡桃木器物托盘</span>
                            <span class="text-[10px] text-brand-berry font-serif font-bold mt-1 block">¥89.00</span>
                        </div>
                    </div>
                    <button onclick="addPrototypeCart(event, '黑胡桃木器物托盘', '¥89.00')" class="w-7 h-7 bg-white rounded-full flex items-center justify-center text-brand-text shadow-sm hover:bg-brand-sage hover:text-white transition-colors">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

        </main>

        <div id="toast" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white text-xs px-6 py-3 rounded-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 text-center"></div>

    </div>

    <script>
        lucide.createIcons();
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }
    </script>
    <script src="assets/prototype-state.js"></script>
</body>
</html>
