<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>购物车 - Wax Atelier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            stone: '#F7F6F2', ivory: '#FFFFF0', sage: '#8FA396',
                            apricot: '#F3E5D8', berry: '#8A2B46', text: '#333333', muted: '#888888'
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif SC"', 'serif'],
                        sans: ['system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #e5e7eb; }
        .app-container { background-color: #F7F6F2; }
        
        /* 自定义复选框 */
        .custom-checkbox {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 1px solid #ccc;
            border-radius: 50%;
            display: inline-block;
            position: relative;
            outline: none;
        }
        .custom-checkbox:checked {
            background-color: #8FA396;
            border-color: #8FA396;
        }
        .custom-checkbox:checked::after {
            content: '';
            position: absolute;
            left: 5px;
            top: 2px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        .cart-option.active {
            border-color: #8FA396;
            background-color: rgba(143, 163, 150, 0.1);
            color: #333333;
        }
    </style>
</head>
<body class="flex justify-center h-screen overflow-hidden text-brand-text">

    <div class="w-full h-full sm:w-[375px] sm:h-[812px] sm:my-auto sm:rounded-[40px] sm:border-[8px] border-gray-800 app-container flex flex-col relative overflow-hidden shadow-2xl font-sans">
        
        <div class="h-7 w-full flex justify-between items-center px-6 pt-2 text-xs font-medium text-gray-800 z-20 bg-brand-stone bg-opacity-90 absolute top-0">
            <span>10:16</span>
            <div class="flex space-x-1 items-center">
                <i data-lucide="signal" class="w-3 h-3"></i>
                <i data-lucide="wifi" class="w-3 h-3"></i>
                <i data-lucide="battery-full" class="w-4 h-4"></i>
            </div>
        </div>

        <header class="pt-10 pb-2 px-4 flex justify-between items-center sticky top-0 z-10 bg-brand-stone bg-opacity-95 border-b border-gray-200/50">
            <div class="w-8"></div>
            <h1 class="text-lg font-bold font-serif">购物车</h1>
            <div class="w-8 text-right">
                <span class="text-sm text-gray-500 cursor-pointer" onclick="showToast('可勾选商品后调整数量或结算')">管理</span>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto no-scrollbar pb-32">
            
            <!-- 地址选择入口 -->
            <div class="bg-white m-3 p-4 rounded-xl flex items-center justify-between shadow-sm cursor-pointer" onclick="window.location.href='地址管理.html?from=cart'">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-full bg-brand-stone flex items-center justify-center">
                        <i data-lucide="map-pin" class="w-4 h-4 text-brand-sage"></i>
                    </div>
                    <div>
                        <div class="flex items-center space-x-2">
                            <span class="text-sm font-bold">张女士</span>
                            <span class="text-xs text-gray-500">138****8888</span>
                        </div>
                        <p class="text-xs text-gray-500 mt-0.5">上海市 徐汇区 某某街道...</p>
                    </div>
                </div>
                <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
            </div>

            <!-- 购物车明细列表 -->
            <div class="bg-white m-3 rounded-xl shadow-sm overflow-hidden">
                <div class="px-4 py-2 bg-brand-stone/60 text-[11px] text-gray-500 flex items-center justify-between">
                    <span>进阶系列</span>
                    <label class="flex items-center gap-1 text-gray-500">
                        <input type="checkbox" class="custom-checkbox series-check" checked onchange="toggleSeriesCart(this)">
                        <span>全选</span>
                    </label>
                </div>
                <!-- 商品 1 -->
                <div class="p-4 flex gap-3 border-b border-gray-50 cart-item-row" data-price="259">
                    <input type="checkbox" class="custom-checkbox cart-item-check self-center" checked>
                    <div class="w-20 h-20 bg-[#F3E5D8] rounded flex-shrink-0"></div>
                    <div class="flex-1 flex flex-col justify-between">
                        <div>
                            <h3 class="text-sm font-medium line-clamp-1">勃艮第红复古卷边蜡烛</h3>
                            <button type="button" class="text-[10px] text-gray-500 mt-1 bg-gray-50 inline-flex items-center px-1.5 py-0.5 rounded" data-size="M" data-scent="玫瑰木" data-carving="水波纹" data-package="精品包装" onclick="openCartConfigEditor(this)">
                                <span class="config-text">M | 玫瑰木 | 水波纹</span>
                                <i data-lucide="chevron-down" class="w-3 h-3 ml-0.5"></i>
                            </button>
                        </div>
                        <div class="flex justify-between items-end mt-2">
                            <span class="text-brand-berry font-bold font-serif text-sm">¥259.00</span>
                            <!-- 数量加减 -->
                            <div class="flex items-center border border-gray-200 rounded">
                                <button onclick="changeStaticQty(this, -1)" class="w-6 h-6 flex items-center justify-center text-gray-500">-</button>
                                <span class="w-6 text-center text-xs cart-qty">1</span>
                                <button onclick="changeStaticQty(this, 1)" class="w-6 h-6 flex items-center justify-center text-gray-500">+</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="px-4 py-2 bg-brand-stone/60 text-[11px] text-gray-500 flex items-center justify-between">
                    <span>节日系列</span>
                    <label class="flex items-center gap-1 text-gray-500">
                        <input type="checkbox" class="custom-checkbox series-check" checked onchange="toggleSeriesCart(this)">
                        <span>全选</span>
                    </label>
                </div>
                <!-- 商品 2 -->
                <div class="p-4 flex gap-3 border-b border-gray-50 cart-item-row" data-price="399">
                    <input type="checkbox" class="custom-checkbox cart-item-check self-center" checked>
                    <div class="w-20 h-20 bg-[#E8EAE6] rounded flex-shrink-0"></div>
                    <div class="flex-1 flex flex-col justify-between">
                        <div>
                            <h3 class="text-sm font-medium line-clamp-1">冬日暖阳双支礼盒</h3>
                            <button type="button" class="text-[10px] text-gray-500 mt-1 bg-gray-50 inline-flex items-center px-1.5 py-0.5 rounded" data-size="M" data-scent="无香陈列" data-carving="叶脉纹" data-package="礼盒包装" onclick="openCartConfigEditor(this)">
                                <span class="config-text">M | 无香陈列 | 叶脉纹</span>
                                <i data-lucide="chevron-down" class="w-3 h-3 ml-0.5"></i>
                            </button>
                        </div>
                        <div class="flex justify-between items-end mt-2">
                            <span class="text-brand-berry font-bold font-serif text-sm">¥399.00</span>
                            <div class="flex items-center border border-gray-200 rounded">
                                <button onclick="changeStaticQty(this, -1)" class="w-6 h-6 flex items-center justify-center text-gray-500">-</button>
                                <span class="w-6 text-center text-xs cart-qty">1</span>
                                <button onclick="changeStaticQty(this, 1)" class="w-6 h-6 flex items-center justify-center text-gray-500">+</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="prototype-cart-extra"></div>
            </div>

            <!-- 阶梯价与加购提示 -->
            <div class="mx-3 mt-2 px-3 py-2 bg-brand-sage/10 rounded-lg flex items-start space-x-2">
                <i data-lucide="info" class="w-4 h-4 text-brand-sage flex-shrink-0 mt-0.5"></i>
                <!--  将此处 href 属性修改为跳转到批发合作说明页 -->
                <p class="text-[11px] text-gray-600 leading-relaxed">当前属于<span class="font-bold">零售价</span>档位。再购买 3 件即可解锁满件 9 折优惠，或<a href="渠道合作申请.html" class="text-brand-sage underline">申请渠道身份</a>获取批发价。</p>
            </div>

        </main>

        <!-- 底部结算栏 -->
        <div class="absolute bottom-[68px] w-full bg-white px-4 py-2 border-t border-gray-100 shadow-[0_-4px_15px_rgba(0,0,0,0.02)] z-30 flex justify-between items-center h-14">
            <div class="flex items-center space-x-2">
                <input type="checkbox" class="custom-checkbox" checked onchange="toggleAllCart(this)">
                <span class="text-xs text-gray-500">全选</span>
            </div>
            <div class="flex items-center space-x-3">
                <div class="text-right">
                    <span class="text-xs text-gray-500">合计:</span>
                    <span id="cart-total" class="text-brand-berry font-bold font-serif">¥658.00</span>
                </div>
                <button onclick="checkoutPrototypeOrder()" class="px-6 py-2 rounded-full bg-brand-text text-white text-sm font-medium">去结算</button>
            </div>
        </div>

        <!-- 底部导航 -->
        <nav class="absolute bottom-0 w-full bg-white/90 backdrop-blur-md pb-safe pt-2 px-2 z-30 flex justify-around items-center h-[68px]">
            <div class="flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-brand-text cursor-pointer transition-colors" onclick="goPage('商城首页.html')">
                <i data-lucide="home" class="w-[22px] h-[22px] mb-1"></i>
                <span class="text-[10px] font-medium">首页</span>
            </div>
            <div class="flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-brand-text cursor-pointer transition-colors" onclick="goPage('商品分类.html')">
                <i data-lucide="layout-grid" class="w-[22px] h-[22px] mb-1"></i>
                <span class="text-[10px] font-medium">分类</span>
            </div>
            <div class="flex flex-col items-center justify-center w-full h-full text-brand-text cursor-pointer relative">
                <i data-lucide="shopping-bag" class="w-[22px] h-[22px] mb-1 text-brand-sage fill-brand-sage/20"></i>
                <span class="text-[10px] font-bold text-brand-sage">购物车</span>
            </div>
            <div class="flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-brand-text cursor-pointer transition-colors" onclick="goPage('我的.html')">
                <i data-lucide="user" class="w-[22px] h-[22px] mb-1"></i>
                <span class="text-[10px] font-medium">我的</span>
            </div>
        </nav>

        <div id="toast" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white text-sm px-6 py-3 rounded-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50">
            提示信息
        </div>

        <div id="cart-config-drawer" class="absolute inset-0 bg-black/40 z-40 hidden flex-col justify-end opacity-0 transition-opacity duration-200">
            <div id="cart-config-sheet" class="bg-white rounded-t-2xl p-4 translate-y-full transition-transform duration-200">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold font-serif text-base">修改商品信息</h3>
                    <button type="button" onclick="closeCartConfigEditor()" class="w-8 h-8 flex items-center justify-center text-gray-400">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>

                <div class="space-y-4">
                    <div>
                        <div class="text-xs text-gray-500 mb-2">尺寸</div>
                        <div class="grid grid-cols-4 gap-2" data-config-group="size">
                            <button type="button" class="cart-option py-2 rounded-lg border border-gray-200 text-xs" data-value="S">S<br><span class="text-[10px] text-gray-400">6x8</span></button>
                            <button type="button" class="cart-option py-2 rounded-lg border border-gray-200 text-xs" data-value="M">M<br><span class="text-[10px] text-gray-400">7x10</span></button>
                            <button type="button" class="cart-option py-2 rounded-lg border border-gray-200 text-xs" data-value="L">L<br><span class="text-[10px] text-gray-400">8x12</span></button>
                            <button type="button" class="cart-option py-2 rounded-lg border border-gray-200 text-xs" data-value="XL">XL<br><span class="text-[10px] text-gray-400">10x15</span></button>
                        </div>
                    </div>
                    <div>
                        <div class="text-xs text-gray-500 mb-2">香型</div>
                        <div class="flex flex-wrap gap-2" data-config-group="scent">
                            <button type="button" class="cart-option px-3 py-2 rounded-lg border border-gray-200 text-xs" data-value="玫瑰木">玫瑰木</button>
                            <button type="button" class="cart-option px-3 py-2 rounded-lg border border-gray-200 text-xs" data-value="白茶">白茶</button>
                            <button type="button" class="cart-option px-3 py-2 rounded-lg border border-gray-200 text-xs" data-value="无香陈列">无香陈列</button>
                        </div>
                    </div>
                    <div>
                        <div class="text-xs text-gray-500 mb-2">雕花</div>
                        <div class="grid grid-cols-3 gap-2" data-config-group="carving">
                            <button type="button" class="cart-option py-2 rounded-lg border border-gray-200 text-xs" data-value="水波纹">水波纹</button>
                            <button type="button" class="cart-option py-2 rounded-lg border border-gray-200 text-xs" data-value="叶脉纹">叶脉纹</button>
                            <button type="button" class="cart-option py-2 rounded-lg border border-gray-200 text-xs" data-value="卷边花冠">卷边花冠</button>
                        </div>
                    </div>
                    <div>
                        <div class="text-xs text-gray-500 mb-2">包装</div>
                        <div class="grid grid-cols-2 gap-2" data-config-group="package">
                            <button type="button" class="cart-option py-2 rounded-lg border border-gray-200 text-xs" data-value="精品包装">精品包装</button>
                            <button type="button" class="cart-option py-2 rounded-lg border border-gray-200 text-xs" data-value="礼盒包装">礼盒包装</button>
                        </div>
                    </div>
                </div>

                <button type="button" onclick="confirmCartConfig()" class="w-full mt-5 py-3 rounded-full bg-brand-text text-white text-sm font-medium">确认修改</button>
            </div>
        </div>
    </div>
    <script>
        lucide.createIcons();
        const CART_KEY = 'wax_new_cart_items';
        let editingConfigTrigger = null;
        let editingCartIndex = null;

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }

        function changeStaticQty(button, delta) {
            const row = button.parentElement;
            const qty = row.querySelector('span');
            const next = Math.max(1, Number(qty.textContent) + delta);
            qty.textContent = next;
            updateCartTotal();
        }

        function getCartRows() {
            return Array.from(document.querySelectorAll('.cart-item-row'));
        }

        function updateCartTotal() {
            let total = 0;
            getCartRows().forEach(function (row) {
                const checked = row.querySelector('.cart-item-check');
                if (!checked || !checked.checked) return;
                const price = Number(row.dataset.price || 0);
                const qty = Number((row.querySelector('.cart-qty') || {}).textContent || 1);
                total += price * qty;
            });
            document.getElementById('cart-total').textContent = '¥' + total.toFixed(2);
            syncCartChecks();
        }

        function syncCartChecks() {
            const rows = getCartRows();
            const checkedRows = rows.filter(function (row) {
                const input = row.querySelector('.cart-item-check');
                return input && input.checked;
            });
            document.querySelectorAll('.absolute.bottom-\\[68px\\] input.custom-checkbox').forEach(function (input) {
                input.checked = rows.length > 0 && checkedRows.length === rows.length;
            });
            document.querySelectorAll('.series-check').forEach(function (input) {
                const seriesRows = getSeriesRows(input);
                input.checked = seriesRows.length > 0 && seriesRows.every(function (row) {
                    const check = row.querySelector('.cart-item-check');
                    return check && check.checked;
                });
            });
        }

        function toggleAllCart(input) {
            document.querySelectorAll('.cart-item-check').forEach(function (item) {
                item.checked = input.checked;
            });
            document.querySelectorAll('.series-check').forEach(function (item) {
                item.checked = input.checked;
            });
            updateCartTotal();
        }

        function getSeriesRows(input) {
            const rows = [];
            let node = input.closest('.flex.items-center.justify-between');
            while (node && node.nextElementSibling) {
                node = node.nextElementSibling;
                if (node.classList.contains('items-center') && node.classList.contains('justify-between')) break;
                if (node.classList.contains('cart-item-row')) rows.push(node);
            }
            return rows;
        }

        function toggleSeriesCart(input) {
            getSeriesRows(input).forEach(function (node) {
                const check = node.querySelector('.cart-item-check');
                if (check) check.checked = input.checked;
            });
            updateCartTotal();
        }

        function readCartItems() {
            try {
                return JSON.parse(localStorage.getItem(CART_KEY) || '[]');
            } catch (error) {
                return [];
            }
        }

        function writeCartItems(items) {
            localStorage.setItem(CART_KEY, JSON.stringify(items));
        }

        function setConfigOption(group, value) {
            document.querySelectorAll('[data-config-group="' + group + '"] .cart-option').forEach(function (button) {
                button.classList.toggle('active', button.dataset.value === value);
            });
        }

        function getConfigOption(group) {
            const active = document.querySelector('[data-config-group="' + group + '"] .cart-option.active');
            return active ? active.dataset.value : '';
        }

        document.querySelectorAll('.cart-option').forEach(function (button) {
            button.addEventListener('click', function () {
                const group = this.closest('[data-config-group]');
                group.querySelectorAll('.cart-option').forEach(function (item) {
                    item.classList.remove('active');
                });
                this.classList.add('active');
            });
        });

        function openCartConfigEditor(trigger, cartIndex) {
            editingConfigTrigger = trigger;
            editingCartIndex = Number.isInteger(cartIndex) ? cartIndex : null;
            const config = editingCartIndex !== null ? (readCartItems()[editingCartIndex] || {}) : trigger.dataset;

            setConfigOption('size', config.size || 'M');
            setConfigOption('scent', config.scent || '玫瑰木');
            setConfigOption('carving', config.carving || '水波纹');
            setConfigOption('package', config.package || '精品包装');

            const drawer = document.getElementById('cart-config-drawer');
            const sheet = document.getElementById('cart-config-sheet');
            drawer.classList.remove('hidden');
            drawer.classList.add('flex');
            void drawer.offsetWidth;
            drawer.classList.add('opacity-100');
            sheet.classList.remove('translate-y-full');
        }

        function closeCartConfigEditor() {
            const drawer = document.getElementById('cart-config-drawer');
            const sheet = document.getElementById('cart-config-sheet');
            sheet.classList.add('translate-y-full');
            drawer.classList.remove('opacity-100');
            setTimeout(function () {
                drawer.classList.add('hidden');
                drawer.classList.remove('flex');
            }, 200);
        }

        function confirmCartConfig() {
            const config = {
                size: getConfigOption('size'),
                scent: getConfigOption('scent'),
                carving: getConfigOption('carving'),
                package: getConfigOption('package')
            };

            if (editingCartIndex !== null) {
                const items = readCartItems();
                if (items[editingCartIndex]) {
                    Object.assign(items[editingCartIndex], config);
                    writeCartItems(items);
                    window.renderPrototypeCartExtras();
                }
            } else if (editingConfigTrigger) {
                Object.assign(editingConfigTrigger.dataset, config);
                const text = editingConfigTrigger.querySelector('.config-text');
                if (text) text.textContent = config.size + ' | ' + config.scent + ' | ' + config.carving;
            }

            closeCartConfigEditor();
            showToast('商品信息已更新');
            lucide.createIcons();
        }

        document.addEventListener('change', function (event) {
            if (event.target.classList.contains('cart-item-check')) updateCartTotal();
        });
        document.addEventListener('DOMContentLoaded', updateCartTotal);
    </script>
    <script src="assets/prototype-state.js"></script>
</body>
</html>
