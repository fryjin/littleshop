<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>地址管理 - Wax Atelier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            stone: '#F7F6F2', ivory: '#FFFFF0', sage: '#8FA396',
                            apricot: '#F3E5D8', berry: '#8A2B46', text: '#333333', muted: '#888888'
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif SC"', 'serif'],
                        sans: ['system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #e5e7eb; }
        .app-container { background-color: #F7F6F2; }
        
        .custom-radio {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 1px solid #ccc;
            border-radius: 50%;
            display: inline-block;
            position: relative;
            outline: none;
        }
        .custom-radio:checked {
            background-color: #8FA396;
            border-color: #8FA396;
        }
        .custom-radio:checked::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 6px;
            background-color: white;
            border-radius: 50%;
        }
    </style>
</head>
<body class="flex justify-center h-screen overflow-hidden text-brand-text">

    <div class="w-full h-full sm:w-[375px] sm:h-[812px] sm:my-auto sm:rounded-[40px] sm:border-[8px] border-gray-800 app-container flex flex-col relative overflow-hidden shadow-2xl font-sans">
        
        <div class="h-7 w-full flex justify-between items-center px-6 pt-2 text-xs font-medium text-gray-800 z-20 bg-brand-stone bg-opacity-90 absolute top-0">
            <span>10:16</span>
            <div class="flex space-x-1 items-center">
                <i data-lucide="signal" class="w-3 h-3"></i>
                <i data-lucide="wifi" class="w-3 h-3"></i>
                <i data-lucide="battery-full" class="w-4 h-4"></i>
            </div>
        </div>

        <header class="pt-10 pb-2 px-4 flex justify-between items-center sticky top-0 z-10 bg-brand-stone bg-opacity-95 border-b border-gray-200/50">
            <div class="w-8 flex items-center cursor-pointer" onclick="goBack('我的.html')">
                <i data-lucide="chevron-left" class="w-6 h-6 text-brand-text"></i>
            </div>
            <h1 class="text-lg font-bold font-serif">收货地址</h1>
            <div class="w-8"></div>
        </header>

        <main id="address-list" class="flex-1 overflow-y-auto no-scrollbar pb-24 p-4 space-y-4">
            
            <!-- 地址卡片 1 (默认) -->
            <div class="bg-white rounded-xl p-4 shadow-sm relative overflow-hidden border border-brand-sage/20">
                <div class="absolute top-0 right-0 bg-brand-sage text-white text-[10px] px-2 py-0.5 rounded-bl-lg font-medium">默认</div>
                
                <div class="flex items-start justify-between mb-3 pr-8">
                    <div>
                        <div class="flex items-center space-x-2 mb-1">
                            <span class="text-base font-bold">张女士</span>
                            <span class="text-sm text-gray-500">138****8888</span>
                        </div>
                        <p class="text-xs text-gray-600 leading-relaxed">上海市 徐汇区 衡山路 某某弄某某号</p>
                    </div>
                </div>
                
                <div class="flex items-center justify-between pt-3 border-t border-gray-50">
                    <label class="flex items-center space-x-2 text-xs text-gray-500 cursor-pointer">
                        <input type="radio" name="default-address" class="custom-radio" checked>
                        <span>设为默认</span>
                    </label>
                    <div class="flex space-x-4 text-xs text-gray-500">
                        <span class="flex items-center cursor-pointer" onclick="showToast('编辑表单将在下一版补充')"><i data-lucide="edit-3" class="w-3 h-3 mr-1"></i> 编辑</span>
                    </div>
                </div>
            </div>

            <!-- 地址卡片 2 -->
            <div class="bg-white rounded-xl p-4 shadow-sm border border-transparent">
                <div class="flex items-start justify-between mb-3">
                    <div>
                        <div class="flex items-center space-x-2 mb-1">
                            <span class="text-base font-bold">李先生</span>
                            <span class="text-sm text-gray-500">139****9999</span>
                            <span class="text-[10px] bg-blue-50 text-blue-500 px-1.5 py-0.5 rounded">公司</span>
                        </div>
                        <p class="text-xs text-gray-600 leading-relaxed">北京市 朝阳区 建国路 某某大厦</p>
                    </div>
                </div>
                
                <div class="flex items-center justify-between pt-3 border-t border-gray-50">
                    <label class="flex items-center space-x-2 text-xs text-gray-500 cursor-pointer">
                        <input type="radio" name="default-address" class="custom-radio">
                        <span>设为默认</span>
                    </label>
                    <div class="flex space-x-4 text-xs text-gray-500">
                        <span class="flex items-center cursor-pointer" onclick="showToast('编辑表单将在下一版补充')"><i data-lucide="edit-3" class="w-3 h-3 mr-1"></i> 编辑</span>
                        <span class="flex items-center cursor-pointer text-red-400" onclick="removeAddress(this)"><i data-lucide="trash-2" class="w-3 h-3 mr-1"></i> 删除</span>
                    </div>
                </div>
            </div>

        </main>

        <!-- 底部添加按钮 -->
        <div class="absolute bottom-0 w-full bg-white px-4 py-4 border-t border-gray-100 pb-safe z-30">
            <button onclick="addMockAddress()" class="w-full bg-brand-text text-white py-3.5 rounded-full font-medium text-sm flex justify-center items-center">
                <i data-lucide="plus" class="w-4 h-4 mr-1"></i> 新增收货地址
            </button>
        </div>

        <div id="toast" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white text-sm px-6 py-3 rounded-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 text-center"></div>

    </div>

    <script>
        lucide.createIcons();
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 2000);
        }

        function removeAddress(target) {
            const card = target.closest('.bg-white');
            if (card) card.remove();
            showToast('地址已删除');
        }

        function addMockAddress() {
            const list = document.getElementById('address-list');
            const card = document.createElement('div');
            card.className = 'bg-white rounded-xl p-4 shadow-sm border border-brand-sage/20';
            card.innerHTML = [
                '<div class="flex items-start justify-between mb-3">',
                '<div><div class="flex items-center space-x-2 mb-1">',
                '<span class="text-base font-bold">新收件人</span>',
                '<span class="text-sm text-gray-500">138****0000</span>',
                '<span class="text-[10px] bg-brand-sage/10 text-brand-sage px-1.5 py-0.5 rounded">新增</span>',
                '</div><p class="text-xs text-gray-600 leading-relaxed">上海市 徐汇区 新增地址示例</p></div>',
                '</div>',
                '<div class="flex items-center justify-between pt-3 border-t border-gray-50">',
                '<label class="flex items-center space-x-2 text-xs text-gray-500 cursor-pointer">',
                '<input type="radio" name="default-address" class="custom-radio"><span>设为默认</span>',
                '</label>',
                '<div class="flex space-x-4 text-xs text-gray-500">',
                '<span class="flex items-center cursor-pointer" onclick="showToast(&quot;编辑表单将在下一版补充&quot;)"><i data-lucide="edit-3" class="w-3 h-3 mr-1"></i> 编辑</span>',
                '<span class="flex items-center cursor-pointer text-red-400" onclick="removeAddress(this)"><i data-lucide="trash-2" class="w-3 h-3 mr-1"></i> 删除</span>',
                '</div></div>'
            ].join('');
            list.appendChild(card);
            lucide.createIcons();
            showToast('已新增示例地址');
        }
    </script>
    <script src="assets/prototype-state.js"></script>
</body>
</html>
