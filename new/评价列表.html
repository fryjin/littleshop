<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>评价列表 - Wax Atelier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            stone: '#F7F6F2', sage: '#8FA396', berry: '#8A2B46', text: '#333333', muted: '#888888'
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif SC"', 'serif'],
                        sans: ['system-ui', '-apple-system', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #e5e7eb; }
        .app-container { background-color: #F7F6F2; }
        .review-panel { display: none; }
        .review-panel.active { display: block; }
        .review-form { display: none; }
        .review-form.active { display: block; }
    </style>
</head>
<body class="flex justify-center h-screen overflow-hidden text-brand-text">
    <div class="w-full h-full sm:w-[375px] sm:h-[812px] sm:my-auto sm:rounded-[40px] sm:border-[8px] border-gray-800 app-container flex flex-col relative overflow-hidden shadow-2xl font-sans">
        <div class="h-7 w-full flex justify-between items-center px-6 pt-2 text-xs font-medium text-gray-800 z-20 bg-brand-stone absolute top-0">
            <span>10:16</span>
            <div class="flex space-x-1 items-center"><i data-lucide="signal" class="w-3 h-3"></i><i data-lucide="wifi" class="w-3 h-3"></i><i data-lucide="battery-full" class="w-4 h-4"></i></div>
        </div>

        <header class="pt-10 pb-2 px-4 flex justify-between items-center sticky top-0 z-10 bg-brand-stone border-b border-gray-200/50">
            <div class="w-8 flex items-center cursor-pointer" onclick="goBack('我的.html')"><i data-lucide="chevron-left" class="w-6 h-6"></i></div>
            <h1 class="text-lg font-bold font-serif">评价</h1>
            <div class="w-8"></div>
        </header>

        <div class="bg-white flex p-2 gap-2 border-b border-gray-100">
            <button class="review-tab flex-1 py-2 rounded-full text-xs font-bold bg-brand-sage text-white" onclick="switchReviewTab(this, 'pending')">待评价</button>
            <button class="review-tab flex-1 py-2 rounded-full text-xs text-gray-500 bg-brand-stone" onclick="switchReviewTab(this, 'reviewed')">已评价/可追评</button>
        </div>

        <main class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-4 pb-10">
            <section id="review-pending" class="review-panel active space-y-3">
                <article class="bg-white rounded-xl p-4 shadow-sm">
                    <div class="flex gap-3">
                        <div class="w-20 h-20 rounded-lg bg-[#E8EAE6] flex items-center justify-center text-[10px] text-brand-sage">商品图</div>
                        <div class="flex-1">
                            <div class="flex justify-between gap-2">
                                <h2 class="text-sm font-bold leading-snug">雾蓝花冠蜡烛</h2>
                                <span class="text-[10px] text-brand-sage bg-brand-sage/10 px-2 py-0.5 rounded-full h-fit">待评价</span>
                            </div>
                            <p class="text-xs text-gray-500 mt-1">M · 白茶 · 叶脉纹</p>
                            <button onclick="openReviewForm('pending-form')" class="mt-3 px-4 py-1.5 rounded-full bg-brand-text text-white text-xs">写评价</button>
                        </div>
                    </div>
                    <div id="pending-form" class="review-form mt-4 pt-4 border-t border-gray-100">
                        <textarea class="w-full h-24 rounded-xl border border-gray-200 bg-brand-stone/40 p-3 text-sm outline-none" placeholder="写下使用感受、香型、包装是否满意"></textarea>
                        <div class="grid grid-cols-2 gap-2 mt-3">
                            <button onclick="addMediaHint(this, '图片已添加')" class="rounded-xl border border-dashed border-gray-300 py-4 text-xs text-gray-500 flex flex-col items-center gap-1">
                                <i data-lucide="image-plus" class="w-5 h-5"></i> 添加图片
                            </button>
                            <button onclick="addMediaHint(this, '视频已添加')" class="rounded-xl border border-dashed border-gray-300 py-4 text-xs text-gray-500 flex flex-col items-center gap-1">
                                <i data-lucide="video" class="w-5 h-5"></i> 添加视频
                            </button>
                        </div>
                        <button onclick="showToast('评价已提交')" class="w-full mt-3 py-2.5 rounded-full bg-brand-sage text-white text-sm font-medium">提交评价</button>
                    </div>
                </article>
            </section>

            <section id="review-reviewed" class="review-panel space-y-3">
                <article class="bg-white rounded-xl p-4 shadow-sm">
                    <div class="flex gap-3">
                        <div class="w-20 h-20 rounded-lg bg-[#F3E5D8] flex items-center justify-center text-[10px] text-brand-sage">商品图</div>
                        <div class="flex-1">
                            <div class="flex justify-between gap-2">
                                <h2 class="text-sm font-bold leading-snug">繁花复古卷边蜡烛</h2>
                                <span class="text-[10px] text-gray-500 bg-brand-stone px-2 py-0.5 rounded-full h-fit">可追评</span>
                            </div>
                            <p class="text-xs text-gray-500 mt-1">礼盒包装 · 玫瑰木 · M</p>
                            <p class="text-xs text-gray-600 mt-2 leading-relaxed">包装很稳，送礼体面。香味比想象中轻一些，适合放客厅。</p>
                            <button onclick="openReviewForm('follow-form')" class="mt-3 px-4 py-1.5 rounded-full border border-brand-sage text-brand-sage text-xs">追评</button>
                        </div>
                    </div>
                    <div id="follow-form" class="review-form mt-4 pt-4 border-t border-gray-100">
                        <textarea class="w-full h-20 rounded-xl border border-gray-200 bg-brand-stone/40 p-3 text-sm outline-none" placeholder="补充使用一段时间后的感受"></textarea>
                        <div class="grid grid-cols-2 gap-2 mt-3">
                            <button onclick="addMediaHint(this, '图片已添加')" class="rounded-xl border border-dashed border-gray-300 py-4 text-xs text-gray-500 flex flex-col items-center gap-1">
                                <i data-lucide="image-plus" class="w-5 h-5"></i> 添加图片
                            </button>
                            <button onclick="addMediaHint(this, '视频已添加')" class="rounded-xl border border-dashed border-gray-300 py-4 text-xs text-gray-500 flex flex-col items-center gap-1">
                                <i data-lucide="video" class="w-5 h-5"></i> 添加视频
                            </button>
                        </div>
                        <button onclick="showToast('追评已提交')" class="w-full mt-3 py-2.5 rounded-full bg-brand-sage text-white text-sm font-medium">提交追评</button>
                    </div>
                </article>
            </section>
        </main>

        <div id="toast" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white text-sm px-6 py-3 rounded-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50"></div>
    </div>

    <script>
        lucide.createIcons();

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('opacity-0');
            setTimeout(function () { toast.classList.add('opacity-0'); }, 1800);
        }

        function switchReviewTab(tab, name) {
            document.querySelectorAll('.review-tab').forEach(function (item) {
                item.className = 'review-tab flex-1 py-2 rounded-full text-xs text-gray-500 bg-brand-stone';
            });
            tab.className = 'review-tab flex-1 py-2 rounded-full text-xs font-bold bg-brand-sage text-white';
            document.querySelectorAll('.review-panel').forEach(function (panel) {
                panel.classList.remove('active');
            });
            document.getElementById('review-' + name).classList.add('active');
            window.location.hash = name;
        }

        function openReviewForm(id) {
            document.getElementById(id).classList.toggle('active');
        }

        function addMediaHint(button, text) {
            button.classList.remove('border-dashed', 'text-gray-500');
            button.classList.add('border-brand-sage', 'text-brand-sage', 'bg-brand-sage/10');
            button.innerHTML = '<i data-lucide="check" class="w-5 h-5"></i> ' + text;
            lucide.createIcons();
        }

        const initialTab = window.location.hash.replace('#', '') || 'pending';
        const initialButton = Array.from(document.querySelectorAll('.review-tab')).find(function (item) {
            return item.getAttribute('onclick').indexOf("'" + initialTab + "'") > -1;
        });
        if (initialButton) switchReviewTab(initialButton, initialTab);
    </script>
    <script src="assets/prototype-state.js"></script>
</body>
</html>
